'use strict';const K='sma_demo_records';let records=[];try{const v=JSON.parse(localStorage.getItem(K)||'[]');records=Array.isArray(v)?v:[]}catch(e){alert('Impossibile leggere le anagrafiche salvate. Non sono state sovrascritte.')}const sections=[['dashboard','◫ Dashboard'],['clienti','♙ Clienti'],['contatti','☷ Contatti'],['agenti','♟ Agenti'],['cantieri','▤ Progetti / Cantieri'],['preventivi','▣ Preventivi'],['ordini','✓ Conferme ordine'],['newsletter','✉ Newsletter'],['listino','▦ Listino prezzi'],['impostazioni','⚙ Impostazioni']];let page='dashboard';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);function persist(){localStorage.setItem(K,JSON.stringify(records))}function isClient(r){return ['clienti','acquisiti','potenziali'].includes(r.type)}function status(r){return r.status||(r.type==='acquisiti'?'acquisito':'potenziale')}function clients(){return records.filter(isClient)}function sites(){return records.filter(r=>r.type==='cantieri')}function clientName(clientId){return clients().find(r=>r.id===clientId)?.name||'Cliente non collegato'}function nav(){ $('menu').innerHTML=sections.map(([k,v])=>`<button class="${page===k?'active':''}" data-nav="${k}">${v}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav))}function show(p){page=p;nav();$('title').textContent=sections.find(s=>s[0]===p)?.[1].replace(/^[^ ]+ /,'')||p;$('subtitle').textContent=p==='dashboard'?'Panoramica delle attività commerciali':'Gestione SMA Ascensori';if(p==='dashboard')dashboard();else if(p==='clienti')listClients();else if(p==='cantieri')listSites();else if(p==='contatti')listContacts();else if(p==='agenti')agentList();else $('content').innerHTML='<div class="panel"><h2>Modulo in preparazione</h2><p class="muted">La funzionalità sarà implementata nelle prossime versioni.</p></div>'}function dashboard(){let c=clients(),s=sites();$('content').innerHTML=`<div class="cards">${[['Clienti acquisiti',c.filter(r=>status(r)==='acquisito').length],['Clienti potenziali',c.filter(r=>status(r)==='potenziale').length],['Contatti',records.filter(r=>r.type==='contatti').length],['Cantieri',s.length]].map(([t,n])=>`<div class="card"><small>${t}</small><strong>${n}</strong></div>`).join('')}</div><div class="panel"><h2>Riepilogo commerciale</h2><table><thead><tr><th>Tipologia</th><th>Offerte</th><th>Ordini</th><th>Valore offerte</th></tr></thead><tbody>${['NI · Nuovi impianti','MOD · Ammodernamenti','RIP · Riparazioni','MAN · Manutenzioni'].map(t=>`<tr><td>${t}</td><td>0</td><td>0</td><td>€ 0,00</td></tr>`).join('')}</tbody></table><p class="note">I moduli preventivi e ordini saranno collegati in una fase successiva.</p></div>`}function listClients(){let c=clients();$('content').innerHTML=`<div class="actions"><button class="btn" id="add">+ Nuovo cliente</button><button class="btn secondary" id="export">Esporta CSV</button><button class="btn secondary" id="import">Importa Excel / CSV</button></div><div class="panel"><h2>Anagrafiche clienti</h2><div class="filters"><input id="q" placeholder="Cerca ragione sociale, comune, email..."><select id="st"><option value="">Tutti gli stati</option><option value="potenziale">Potenziali</option><option value="acquisito">Acquisiti</option></select><select id="kind"><option value="">Tutte le tipologie</option>${['Azienda','Privato','Professionista','Condominio','Impresa edile'].map(x=>`<option>${x}</option>`).join('')}</select></div><table><thead><tr><th>Cliente</th><th>Tipologia</th><th>Comune</th><th>Stato</th><th>Cantieri</th></tr></thead><tbody id="rows"></tbody></table></div>`;$('add').onclick=()=>clientForm();$('export').onclick=exportClients;$('import').onclick=importClients;['q','st','kind'].forEach(k=>$(k).oninput=render);render();function render(){let q=$('q').value.toLowerCase(),st=$('st').value,kind=$('kind').value;let out=c.filter(r=>(!st||status(r)===st)&&(!kind||r.kind===kind)&&[r.name,r.city,r.email,r.phone,r.vat].join(' ').toLowerCase().includes(q));$('rows').innerHTML=out.map(r=>`<tr><td><button class="link" data-id="${esc(r.id)}">${esc(r.name)}</button><div class="pill">${esc(r.email)}</div></td><td>${esc(r.kind||'Non specificata')}</td><td>${esc(r.city)}</td><td><span class="tag ${status(r)==='acquisito'?'ok':'lead'}">${status(r)==='acquisito'?'Acquisito':'Potenziale'}</span></td><td>${sites().filter(s=>s.clientId===r.id).length}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nessuna anagrafica trovata</td></tr>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>clientDetail(b.dataset.id))}}function input(name,label,value='',required=false,opts=''){return `<div><label for="f_${name}">${label}${required?' *':''}</label><input id="f_${name}" name="${name}" value="${esc(value)}" ${required?'required':''} ${opts}></div>`}function select(name,label,options,value){return `<div><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}function clientForm(clientId){let old=clients().find(r=>r.id===clientId)||{};$('title').textContent=clientId?'Modifica cliente':'Nuovo cliente';$('content').innerHTML=`<div class="panel"><h2>Dati anagrafici</h2><form id="entry">${select('kind','Tipologia soggetto *',['Azienda','Privato','Professionista','Condominio','Impresa edile'],old.kind||'Azienda')}${select('status','Stato commerciale *',['potenziale','acquisito'],status(old))}<div class="full" id="namelabel">${input('name','Ragione sociale / Denominazione',old.name,true)}</div>${input('phone','Telefono',old.phone,true)}${input('email','Email',old.email,true,'type="email"')}${input('street','Via / Piazza e numero civico',old.street,true)}${input('cap','CAP',old.cap,true)}${input('city','Comune',old.city,true)}${input('province','Provincia',old.province,true)}${input('vat','Partita IVA',old.vat)}${input('taxCode','Codice fiscale',old.taxCode)}${input('pec','PEC',old.pec)}${input('sdi','Codice SDI',old.sdi)}${input('role','Qualifica / Albo',old.role)}${input('contactPerson','Referente',old.contactPerson)}<div class="full"><label>Note</label><textarea name="notes">${esc(old.notes)}</textarea></div><div class="full line"><button class="btn" type="submit">Salva cliente</button><button class="btn secondary" type="button" id="cancel">Annulla</button></div></form><p class="note">I dati sono salvati solo in questo browser. Non inserire dati aziendali reali nella demo pubblica.</p></div>`;const updateName=()=>{let kind=$('f_kind').value;let lab=kind==='Privato'?'Nome e cognome':kind==='Professionista'?'Nome, cognome e qualifica':kind==='Condominio'?'Denominazione condominio':'Ragione sociale';document.querySelector('label[for="f_name"]').textContent=lab+' *'};$('f_kind').onchange=updateName;updateName();setupAddressAutocomplete();$('cancel').onclick=()=>clientId?clientDetail(clientId):show('clienti');$('entry').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(clientId){Object.assign(old,obj,{type:'clienti'})}else records.push({id:id(),type:'clienti',...obj});persist();show('clienti')}}function clientDetail(clientId){let c=clients().find(r=>r.id===clientId);if(!c)return show('clienti');$('title').textContent=c.name;$('subtitle').textContent='Scheda cliente · '+(c.kind||'Tipologia non specificata');let linked=sites().filter(s=>s.clientId===clientId);$('content').innerHTML=`<div class="actions"><button class="btn secondary" id="back">← Tutti i clienti</button><button class="btn" id="edit">Modifica cliente</button><button class="btn secondary" id="newsite">+ Nuovo cantiere collegato</button></div><div class="panel"><h2>Informazioni cliente</h2><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><p class="muted">Stato commerciale</p><strong>${status(c)==='acquisito'?'Acquisito':'Potenziale'}</strong></div><div><p class="muted">Tipologia</p><strong>${esc(c.kind||'Non specificata')}</strong></div><div><p class="muted">Contatti</p>${esc(c.email)}<br>${esc(c.phone)}</div><div><p class="muted">Indirizzo</p>${esc(c.street)} ${esc(c.cap)} ${esc(c.city)} (${esc(c.province)})</div></div></div><div class="panel"><h2>Contatti collegati</h2><table><tbody>${records.filter(r=>r.type==='contatti'&&(r.clientLinks||[]).some(l=>l.clientId===clientId)).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc((r.clientLinks||[]).find(l=>l.clientId===clientId)?.role||r.role||'')}</td><td>${esc(r.phone)}</td></tr>`).join('')||'<tr><td class="empty">Nessun contatto collegato</td></tr>'}</tbody></table></div><div class="panel"><h2>Cantieri collegati (${linked.length})</h2><table><thead><tr><th>Riferimento</th><th>Comune</th><th>Indirizzo</th></tr></thead><tbody>${linked.map(s=>`<tr><td><button class="link" data-site="${esc(s.id)}">${esc(s.name)}</button></td><td>${esc(s.city)}</td><td>${esc(s.street)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nessun cantiere collegato</td></tr>'}</tbody></table></div>`;$('back').onclick=()=>show('clienti');$('edit').onclick=()=>clientForm(clientId);$('newsite').onclick=()=>siteForm(null,clientId);document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>siteDetail(b.dataset.site))}function listSites(){let all=sites();$('content').innerHTML=`<div class="actions"><button class="btn" id="add">+ Nuovo cantiere</button><button class="btn secondary" id="export">Esporta CSV</button></div><div class="panel"><h2>Progetti e cantieri</h2><input id="q" placeholder="Cerca cantiere, comune o cliente..."><table><thead><tr><th>Cantiere</th><th>Cliente collegato</th><th>Comune</th><th>Indirizzo</th></tr></thead><tbody id="rows"></tbody></table></div>`;$('add').onclick=()=>siteForm();$('export').onclick=exportSites;$('q').oninput=render;render();function render(){let q=$('q').value.toLowerCase();let out=all.filter(r=>[r.name,r.city,r.street,clientName(r.clientId)].join(' ').toLowerCase().includes(q));$('rows').innerHTML=out.map(r=>`<tr><td><button class="link" data-site="${esc(r.id)}">${esc(r.name)}</button></td><td>${r.clientId&&clients().some(c=>c.id===r.clientId)?`<button class="link" data-client="${esc(r.clientId)}">${esc(clientName(r.clientId))}</button>`:'<span class="muted">Da collegare</span>'}</td><td>${esc(r.city)}</td><td>${esc(r.street)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nessun cantiere trovato</td></tr>';document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>siteDetail(b.dataset.site));document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>clientDetail(b.dataset.client))}}function siteForm(siteId,initialClientId){let old=sites().find(r=>r.id===siteId)||{},all=clients();$('title').textContent=siteId?'Modifica cantiere':'Nuovo cantiere';$('content').innerHTML=`<div class="panel"><h2>Dati cantiere</h2><form id="entry"><div class="full"><label>Cliente collegato *</label><select name="clientId" required><option value="">Seleziona un cliente...</option>${all.map(c=>`<option value="${esc(c.id)}" ${c.id===(old.clientId||initialClientId)?'selected':''}>${esc(c.name)}</option>`).join('')}</select><p class="note">Il cliente deve essere già presente nell'anagrafica.</p></div><div class="full">${input('name','Nome / Riferimento cantiere',old.name,true)}</div>${input('street','Via / Piazza e numero civico',old.street,true)}${input('cap','CAP',old.cap,true)}${input('city','Comune',old.city,true)}${input('province','Provincia',old.province,true)}${input('contactPerson','Referente cantiere',old.contactPerson)}${input('finalCustomer','Committente finale (facoltativo)',old.finalCustomer)}<div class="full"><label>Note</label><textarea name="notes">${esc(old.notes)}</textarea></div><div class="full line"><button class="btn" type="submit" ${!all.length?'disabled':''}>Salva cantiere</button><button class="btn secondary" type="button" id="cancel">Annulla</button></div></form>${!all.length?'<p class="note">Prima crea almeno un cliente nella sezione Clienti.</p>':''}</div>`;setupAddressAutocomplete();$('cancel').onclick=()=>siteId?siteDetail(siteId):initialClientId?clientDetail(initialClientId):show('cantieri');$('entry').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(!all.some(c=>c.id===obj.clientId))return alert('Seleziona un cliente valido');if(siteId)Object.assign(old,obj);else records.push({id:id(),type:'cantieri',...obj});persist();show('cantieri')}}function siteDetail(siteId){let s=sites().find(r=>r.id===siteId);if(!s)return show('cantieri');$('title').textContent=s.name;$('subtitle').textContent='Scheda progetto / cantiere';let c=clients().find(x=>x.id===s.clientId);$('content').innerHTML=`<div class="actions"><button class="btn secondary" id="back">← Tutti i cantieri</button><button class="btn" id="edit">Modifica cantiere</button></div><div class="panel"><h2>Cliente collegato</h2>${c?`<button class="link" id="openClient">${esc(c.name)}</button><p class="note">${esc(c.kind||'')} · ${esc(c.email||'')}</p>`:'<p class="muted">Questo cantiere proviene dalla versione precedente: seleziona un cliente con “Modifica cantiere”.</p>'}<div class="divider"></div><h2>Ubicazione del cantiere</h2><p>${esc(s.street)}, ${esc(s.cap)} ${esc(s.city)} (${esc(s.province)})</p><p class="note">Committente finale: ${esc(s.finalCustomer||'Non indicato')}<br>Referente: ${esc(s.contactPerson||'Non indicato')}</p><p>${esc(s.notes||'')}</p></div>`;$('back').onclick=()=>show('cantieri');$('edit').onclick=()=>siteForm(siteId);if(c)$('openClient').onclick=()=>clientDetail(c.id)}function listContacts(){let c=records.filter(r=>r.type==='contatti');$('content').innerHTML=`<div class="actions"><button class="btn" id="add">+ Nuovo contatto</button></div><div class="panel"><h2>Contatti</h2><table><thead><tr><th>Nome</th><th>Telefono</th><th>Email</th><th>Comune</th><th>Clienti collegati</th></tr></thead><tbody>${c.map(r=>`<tr><td><button class="link" data-contact="${esc(r.id)}">${esc(r.name)}</button></td><td>${esc(r.phone)}</td><td>${esc(r.email)}</td><td>${esc(r.city)}</td><td>${(r.clientLinks||[]).map(l=>esc(clientName(l.clientId))).join(', ')||'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nessun contatto</td></tr>'}</tbody></table></div>`;$('add').onclick=()=>contactForm();document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>contactForm(b.dataset.contact))}function contactForm(contactId){let old=records.find(r=>r.id===contactId&&r.type==='contatti')||{};$('title').textContent=contactId?'Modifica contatto':'Nuovo contatto';$('content').innerHTML=`<div class="panel"><form id="entry">${input('name','Nome e cognome',old.name,true)}${input('phone','Telefono',old.phone,true)}${input('email','Email',old.email,true,'type="email"')}${input('city','Comune',old.city,true)}${input('role','Ruolo / Qualifica',old.role)}<div class="full"><label>Clienti collegati e ruolo per cliente</label><div id="clientLinks"></div><button class="btn secondary" type="button" id="addLink">+ Collega cliente</button></div><div class="full line"><button class="btn">Salva contatto</button><button type="button" class="btn secondary" id="cancel">Annulla</button></div></form></div>`;const addLink=(link={})=>{let row=document.createElement('div');row.className='line';row.style.marginBottom='9px';row.innerHTML=`<select class="linked-client" style="flex:2;min-width:160px"><option value="">Seleziona cliente</option>${clients().map(c=>`<option value="${esc(c.id)}" ${link.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input class="linked-role" placeholder="Ruolo presso il cliente" value="${esc(link.role||'')}" style="flex:2;min-width:140px"><button class="btn secondary" type="button">Rimuovi</button>`;row.querySelector('button').onclick=()=>row.remove();$('clientLinks').appendChild(row)};(old.clientLinks||[]).forEach(addLink);$('addLink').onclick=()=>addLink();setupAddressAutocomplete();$('cancel').onclick=()=>show('contatti');$('entry').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));obj.clientLinks=[...document.querySelectorAll('#clientLinks .line')].map(row=>({clientId:row.querySelector('.linked-client').value,role:row.querySelector('.linked-role').value})).filter(l=>l.clientId);if(contactId)Object.assign(old,obj);else records.push({id:id(),type:'contatti',...obj});persist();show('contatti')}}function csvExport(filename,rows,keys){let csv=[keys.join(';'),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function exportClients(){csvExport('sma-clienti.csv',clients().map(r=>({...r,status:status(r)})),['name','kind','status','phone','email','street','cap','city','province','vat','taxCode','pec','sdi','notes'])}function exportSites(){csvExport('sma-cantieri.csv',sites().map(r=>({...r,clientName:clientName(r.clientId)})),['name','clientName','street','cap','city','province','contactPerson','finalCustomer','notes'])}

let comuniCache=null;
async function loadComuni(){if(comuniCache)return comuniCache;const res=await fetch('https://raw.githubusercontent.com/matteocontrini/comuni-json/master/comuni.json');if(!res.ok)throw Error('Archivio comuni non disponibile');const data=await res.json();comuniCache=data;return data}
function setupAddressAutocomplete(){const city=$('f_city');if(!city)return;const list=document.createElement('datalist');list.id='sma-comuni';document.body.appendChild(list);city.setAttribute('list','sma-comuni');let all=[];loadComuni().then(data=>{all=data}).catch(()=>{city.title='Ricerca automatica non disponibile: inserire manualmente'});const fill=()=>{const q=city.value.trim().toLowerCase();list.innerHTML='';if(q.length<2)return;all.filter(c=>c.nome.toLowerCase().startsWith(q)).slice(0,30).forEach(c=>{let o=document.createElement('option');o.value=c.nome;list.appendChild(o)});const c=all.find(c=>c.nome.toLowerCase()===q);if(c){const province=$('f_province'),cap=$('f_cap');if(province)province.value=c.sigla||c.provincia?.sigla||'';if(cap){const caps=Array.isArray(c.cap)?c.cap:[c.cap].filter(Boolean);if(caps.length===1)cap.value=caps[0];else if(caps.length>1){cap.placeholder='CAP da selezionare: '+caps.slice(0,4).join(', ');cap.value=''}}}};city.addEventListener('input',fill);city.addEventListener('change',fill)}
function parseCSV(text){const first=text.split(/\r?\n/)[0]||'';const delim=[';',',','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===delim&&!quoted){row.push(cell);cell=''}else if((ch==='\r'||ch==='\n')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()))rows.push(row);row=[]}else cell+=ch}row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row);return rows}

function renderImport(matrix){const headers=matrix[0].map(x=>String(x).trim());const rows=matrix.slice(1).filter(r=>r.some(v=>String(v).trim()));const fields=[['name','Nome / Ragione sociale'],['kind','Tipologia'],['status','Stato commerciale'],['phone','Telefono'],['email','Email'],['street','Indirizzo'],['cap','CAP'],['city','Comune'],['province','Provincia'],['vat','Partita IVA'],['taxCode','Codice fiscale'],['pec','PEC'],['sdi','SDI']];const aliases={name:['nome','ragione sociale','denominazione','cliente'],kind:['tipo','tipologia','categoria'],status:['stato','stato commerciale'],phone:['telefono','cellulare','tel'],email:['email','e-mail','mail'],street:['indirizzo','via','indirizzo completo'],cap:['cap'],city:['comune','citta','città'],province:['provincia','prov'],vat:['partita iva','piva','p.iva'],taxCode:['codice fiscale','cf'],pec:['pec'],sdi:['sdi']};const norm=x=>String(x??'').toLowerCase().trim().replace(/[^a-z0-9àèéìòù]/g,'');$('importWork').innerHTML='<h2>Associa le colonne</h2><div id="mappings" class="filters" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"></div><div class="line"><label>Stato predefinito <select id="defaultStatus"><option value="potenziale">Potenziale</option><option value="acquisito">Acquisito</option></select></label><label>Tipologia predefinita <select id="defaultKind"><option>Azienda</option><option>Privato</option><option>Professionista</option><option>Condominio</option><option>Impresa edile</option></select></label><label>Duplicati <select id="duplicateMode"><option value="skip">Ignora</option><option value="update">Aggiorna</option></select></label></div><button class="btn" id="previewImport">Controlla righe</button><div id="previewResult"></div>';fields.forEach(([key,label])=>{let div=document.createElement('div');div.innerHTML='<label>'+esc(label)+'</label>';let sel=document.createElement('select');sel.dataset.key=key;sel.add(new Option('Non importare',''));headers.forEach((h,i)=>sel.add(new Option(h||'Colonna '+(i+1),String(i))));const i=headers.findIndex(h=>(aliases[key]||[]).some(a=>norm(a)===norm(h)));sel.value=i<0?'':String(i);div.appendChild(sel);$('mappings').appendChild(div)});const make=()=>rows.map((r,i)=>{let obj={};document.querySelectorAll('#mappings select').forEach(sel=>obj[sel.dataset.key]=sel.value===''?'':String(r[Number(sel.value)]??'').trim());obj.kind=['Azienda','Privato','Professionista','Condominio','Impresa edile'].find(t=>norm(t)===norm(obj.kind))||$('defaultKind').value;obj.status=['acquisito','cliente','attivo'].includes(norm(obj.status))?'acquisito':obj.status? 'potenziale':$('defaultStatus').value;obj.errors=['name','phone','email','street','cap','city','province'].filter(k=>!obj[k]);if(obj.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(obj.email))obj.errors.push('email non valida');obj.row=i+2;return obj});const duplicate=(obj)=>clients().find(c=>(obj.vat&&norm(obj.vat)===norm(c.vat))||(obj.taxCode&&norm(obj.taxCode)===norm(c.taxCode))||(norm(obj.name)===norm(c.name)&&norm(obj.street)===norm(c.street)&&norm(obj.city)===norm(c.city)));$('previewImport').onclick=()=>{const data=make();$('previewResult').innerHTML='<h2>Anteprima ('+data.length+' righe)</h2><div style="max-height:360px;overflow:auto"><table><tr><th>Riga</th><th>Cliente</th><th>Comune</th><th>Esito</th></tr>'+data.slice(0,200).map(r=>'<tr><td>'+r.row+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.city)+'</td><td>'+esc(r.errors.length?'Errore: '+r.errors.join(', '):duplicate(r)?'Duplicato':'Valido')+'</td></tr>').join('')+'</table></div><p class="note">Righe con errori escluse; primi 200 risultati mostrati.</p><button class="btn" id="confirmImport">Conferma importazione</button>';$('confirmImport').onclick=()=>{const input=make(),mode=$('duplicateMode').value;let added=0,updated=0,skipped=0,seen=new Set();const original=JSON.stringify(records);for(const r of input){if(r.errors.length){skipped++;continue}const key=norm(r.vat)||norm(r.taxCode)||norm(r.name)+'|'+norm(r.street)+'|'+norm(r.city);if(seen.has(key)){skipped++;continue}seen.add(key);const old=duplicate(r);const obj={...r};delete obj.errors;delete obj.row;if(old){if(mode==='update'){Object.keys(obj).forEach(k=>{if(obj[k])old[k]=obj[k]});updated++}else skipped++}else{records.push({id:id(),type:'clienti',...obj});added++}}try{persist();alert('Importazione completata: '+added+' nuovi, '+updated+' aggiornati, '+skipped+' ignorati.');show('clienti')}catch(e){records=JSON.parse(original);alert('Impossibile salvare: spazio locale insufficiente')}}}}

  $('dPipeline').innerHTML=`<div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><p class="muted">Aperte</p><strong>${open.length}</strong></div><div><p class="muted">Valore aperto</p><strong>${euro(sum(open))}</strong></div><div><p class="muted">Senza esito da 30+ giorni</p><strong>${open.filter(d=>(today-new Date((d.date||'')+'T12:00:00'))/86400000>=30).length}</strong></div><div><p class="muted">Offerte perse</p><strong>${offers.filter(d=>d.state==='persa').length}</strong></div></div><p class="dash-alert">* Conversione indicativa sul periodo: gli ordini confermati possono riferirsi a offerte emesse in periodi precedenti.</p>`;
  const group=(values,field)=>[...new Set(values.map(d=>field(d)))].sort().map(name=>({name,off:offers.filter(d=>field(d)===name),ord:orders.filter(d=>field(d)===name)}));
  const rows=(groups,cat=false)=>groups.map(g=>{const n=g.off.length,k=g.ord.length;return `<tr><td>${esc(g.name)}</td><td>${n}</td><td>${euro(sum(g.off))}</td><td>${k}</td><td>${euro(sum(g.ord))}</td><td>${cat?euro(sum(g.off.filter(d=>d.state==='aperta'))):(n?(k/n*100).toFixed(1).replace('.',',')+'%':'—')}</td></tr>`}).join('');
  $('dAgents').innerHTML=rows(group(matched,d=>(d.agent||'').trim()||'Non assegnato'))||'<tr><td colspan="6">Nessun dato</td></tr>';

  $('dRegistry').innerHTML=[['Clienti potenziali',clients().filter(c=>status(c)==='potenziale').length],['Contatti',records.filter(r=>r.type==='contatti').length],['Cantieri',sites().length],['Clienti totali',clients().length]].map(([l,n])=>`<div class="card"><small>${l}</small><strong>${n}</strong></div>`).join('');

/* Migliora tutte le tabelle del CRM, comprese quelle ricreate dai filtri. */
const tableStyle=document.createElement('style');tableStyle.textContent=`table thead th[data-sortable]{cursor:pointer;white-space:nowrap;user-select:none}table thead th[data-sortable]:hover{color:#b20d19}table thead th .sortmark{opacity:.55;font-size:11px;margin-left:5px}tr.table-filters th{padding:5px 6px!important;background:#fafafa}tr.table-filters input{width:100%;min-width:65px;box-sizing:border-box;padding:6px;font-size:11px;border:1px solid #ddd;border-radius:5px}tr.table-filters th:last-child input{min-width:55px}`;document.head.appendChild(tableStyle);
function enhanceTables(){
 document.querySelectorAll('#content table').forEach(table=>{
  if(table.dataset.enhanced==='1')return;
  const head=table.tHead,body=table.tBodies[0];if(!head||!body||!head.rows.length)return;
  const headings=Array.from(head.rows[0].cells);if(headings.length<2)return;
  table.dataset.enhanced='1';let sortIndex=-1,sortDir=1;
  const filterRow=document.createElement('tr');filterRow.className='table-filters';
  headings.forEach((th,i)=>{
   th.dataset.sortable='1';const mark=document.createElement('span');mark.className='sortmark';mark.textContent='↕';th.appendChild(mark);
   const cell=document.createElement('th'),field=document.createElement('input');field.type='search';field.placeholder='Filtra';field.setAttribute('aria-label','Filtra '+th.textContent.replace('↕','').trim());cell.appendChild(field);filterRow.appendChild(cell);
   field.addEventListener('input',apply);
   th.addEventListener('click',()=>{sortDir=sortIndex===i?-sortDir:1;sortIndex=i;headings.forEach(h=>h.querySelector('.sortmark').textContent='↕');mark.textContent=sortDir===1?'↑':'↓';apply()});
  });head.appendChild(filterRow);
  function normalize(v){let t=v.trim().replace(/\s/g,'');if(/^[€+-]?[\d.,]+%?$/.test(t)){t=t.replace('€','').replace('%','');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');const n=Number(t);if(Number.isFinite(n))return n}return v.toLocaleLowerCase('it-IT')}
  function apply(){const queries=Array.from(filterRow.querySelectorAll('input')).map(x=>x.value.toLocaleLowerCase('it-IT').trim());const rows=Array.from(body.rows);rows.forEach(r=>{r.hidden=queries.some((q,i)=>q&&!String(r.cells[i]?.innerText||r.cells[i]?.textContent||'').toLocaleLowerCase('it-IT').includes(q))});if(sortIndex>=0){rows.sort((a,b)=>{const x=normalize(a.cells[sortIndex]?.textContent||''),y=normalize(b.cells[sortIndex]?.textContent||'');return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'it',{numeric:true}))*sortDir}).forEach(r=>body.appendChild(r))}}
 });
}
const tableObserver=new MutationObserver(()=>{tableObserver.disconnect();enhanceTables();tableObserver.observe($('content'),{childList:true,subtree:true})});
tableObserver.observe($('content'),{childList:true,subtree:true});

 }else if(tab==='data'){
  body.innerHTML=`<h2>Backup e ripristino</h2><p class="settings-help">Esporta in un unico file JSON anagrafiche, offerte, agenti e preferenze. Il ripristino sostituisce i dati della demo presenti in questo browser. Non contiene credenziali e non è un backup server.</p><div class="actions"><button class="btn" id="backupAll">Esporta backup completo</button><button class="btn secondary" id="importBackup">Importa backup</button><input id="backupFile" type="file" accept=".json,application/json" style="display:none"><button class="btn secondary" id="exportPrefs">Esporta solo impostazioni</button><button class="btn secondary" id="resetPrefs">Ripristina impostazioni predefinite</button></div><p class="settings-help">I dati sono conservati nel localStorage del browser. Non cancellare i dati di navigazione prima di aver eseguito un backup.</p>`;
  $('backupAll').onclick=()=>downloadJSON('sma-crm-backup-'+new Date().toISOString().slice(0,10)+'.json',{format:'sma-crm-backup',version:1,exportedAt:new Date().toISOString(),records,commercial,agents,priceList,preferences:prefs});
  $('exportPrefs').onclick=()=>downloadJSON('sma-crm-impostazioni.json',{format:'sma-crm-preferences',preferences:prefs});
  $('resetPrefs').onclick=()=>{if(!confirm('Ripristinare tutte le impostazioni grafiche e di visualizzazione? Le anagrafiche resteranno intatte.'))return;prefs={...PREF_DEFAULT,widgets:[...PREF_DEFAULT.widgets],hiddenColumns:{}};savePreferences();settingsPage('data')};
  $('importBackup').onclick=()=>$('backupFile').click();$('backupFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>8e6)throw Error('File troppo grande');const d=JSON.parse(await f.text());if(d.format!=='sma-crm-backup'||!Array.isArray(d.records)||!Array.isArray(d.commercial)||!Array.isArray(d.agents)||!d.preferences||typeof d.preferences!=='object')throw Error('Formato backup non riconosciuto');if(!confirm(`Ripristinare ${d.records.length} anagrafiche, ${d.commercial.length} offerte e ${d.agents.length} agenti? I dati attuali verranno sostituiti.`))return;const snapshot=[localStorage.getItem(K),localStorage.getItem(COMMERCIAL_KEY),localStorage.getItem(AGENT_KEY),localStorage.getItem(PREF_KEY),localStorage.getItem(PRICE_KEY)];try{localStorage.setItem(K,JSON.stringify(d.records));localStorage.setItem(COMMERCIAL_KEY,JSON.stringify(d.commercial));localStorage.setItem(AGENT_KEY,JSON.stringify(d.agents));localStorage.setItem(PREF_KEY,JSON.stringify(d.preferences));if(Array.isArray(d.priceList))localStorage.setItem(PRICE_KEY,JSON.stringify(d.priceList));else localStorage.removeItem(PRICE_KEY)}catch(err){[K,COMMERCIAL_KEY,AGENT_KEY,PREF_KEY,PRICE_KEY].forEach((key,i)=>snapshot[i]===null?localStorage.removeItem(key):localStorage.setItem(key,snapshot[i]));throw err}records=d.records;commercial=d.commercial;agents=d.agents;priceList=Array.isArray(d.priceList)?d.priceList:[];prefs={...PREF_DEFAULT,...d.preferences};applyPreferences();alert('Backup ripristinato');show('dashboard')}catch(err){alert('Ripristino non riuscito: '+err.message)}};

 document.querySelectorAll('[data-pref]').forEach(el=>{el.onchange=()=>{let val=el.value;if(['dashColumns','followDays','fontScale','quoteValidity','defaultVAT'].includes(el.dataset.pref))val=Number(val);prefs[el.dataset.pref]=val;if(el.dataset.pref==='theme'){[prefs.accent,prefs.background,prefs.surface]=themePresets[val]||themePresets.sma}savePreferences();if(el.dataset.pref==='theme')settingsPage('appearance')}});
}
function downloadJSON(filename,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function applyDashboardLayout(){if(page!=='dashboard')return;const content=$('content');if(!content||!$('dKpis'))return;const kpis=$('dKpis');kpis.style.gridTemplateColumns=`repeat(${Number(prefs.dashColumns)||3},minmax(0,1fr))`;
 const panelById={trend:document.getElementById('dChart')?.closest('.panel'),pipeline:document.getElementById('dPipeline')?.closest('.panel'),agents:document.getElementById('dAgents')?.closest('.panel'),categories:document.getElementById('dCategories')?.closest('.panel'),follow:document.getElementById('dFollow')?.closest('.panel'),registry:document.getElementById('dRegistry')?.closest('.panel')};
 const pair=panelById.trend?.parentElement;if(pair?.classList.contains('dash-two')){pair.classList.remove('dash-two');pair.style.display='contents'}
 const blocks={kpis,...panelById};Object.entries(blocks).forEach(([k,el])=>{if(el)el.style.display=prefs.widgets.includes(k)?'':'none'});

const PRICE_KEY='sma_demo_pricelist_v19';
let priceList=[];
try{const saved=JSON.parse(localStorage.getItem(PRICE_KEY)||'[]');priceList=Array.isArray(saved)?saved:[]}catch(e){priceList=[]}

function priceMoney(v){return euro(Number(v)||0)}
function priceListPage(){
 page='listino';nav();$('title').textContent='Listino prezzi';$('subtitle').textContent='Voci preconfigurate per riparazioni e modernizzazioni · prezzi IVA esclusa';
 const groups=[...new Set(priceList.map(x=>x.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));
 $('content').innerHTML=`<div class="actions"><button class="btn" id="priceNew">+ Nuova voce</button><button class="btn secondary" id="priceCsv">Esporta CSV</button><button class="btn secondary" id="priceImport">Importa CSV</button><input type="file" id="priceFile" accept=".csv,text/csv" hidden></div>
 <div class="cards"><div class="card"><small>Voci di listino</small><strong>${priceList.length}</strong></div><div class="card"><small>Gruppi</small><strong>${groups.length}</strong></div><div class="card"><small>Voci RIP</small><strong>${priceList.filter(x=>x.rip).length}</strong></div><div class="card"><small>Voci MOD</small><strong>${priceList.filter(x=>x.mod).length}</strong></div></div>
 <div class="panel"><h2>Catalogo voci</h2><div class="filters"><input id="priceQuery" placeholder="Cerca codice, titolo o descrizione..."><select id="priceGroup"><option value="">Tutti i gruppi</option>${groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}</select><select id="priceType"><option value="">RIP e MOD</option><option value="RIP">Solo voci RIP</option><option value="MOD">Solo voci MOD</option></select></div><div style="overflow-x:auto"><table><thead><tr><th>Codice</th><th>Gruppo</th><th>Titolo</th><th>Foto</th><th>Utilizzo</th><th>Prezzo cliente (IVA escl.)</th><th>Azioni</th></tr></thead><tbody id="priceRows"></tbody></table></div><p class="note">Questo listino è un archivio di voci preconfigurate. Il collegamento automatico delle voci ai preventivi sarà sviluppato nel prossimo passaggio. I dati restano salvati nel browser.</p></div>`;
 $('priceNew').onclick=()=>priceForm();$('priceCsv').onclick=()=>csvExport('sma-listino-prezzi.csv',priceList.map(x=>({code:x.code,group:x.group,title:x.title,description:x.description,price:x.price,rip:x.rip?'SI':'NO',mod:x.mod?'SI':'NO'})),['code','group','title','description','price','rip','mod']);
 $('priceImport').onclick=()=>$('priceFile').click();$('priceFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>3e6)throw Error('File troppo grande (massimo 3 MB)');const rows=parseCSV((await f.text()).replace(/^\ufeff/,''));if(rows.length<2)throw Error('CSV vuoto');const headers=rows[0].map(x=>String(x).trim().toLowerCase());const required=['group','title','description','price'];if(required.some(x=>!headers.includes(x)))throw Error('Colonne obbligatorie: group, title, description, price');const get=(r,k)=>String(r[headers.indexOf(k)]??'').trim();const incoming=rows.slice(1).filter(r=>r.some(v=>String(v).trim())).map(r=>{const p=Number(get(r,'price').replace(',','.'));const rip=headers.includes('rip')?!['no','0','false'].includes(get(r,'rip').toLowerCase()):true;const mod=headers.includes('mod')?!['no','0','false'].includes(get(r,'mod').toLowerCase()):true;return {id:id(),code:headers.includes('code')?get(r,'code'):'',group:get(r,'group'),title:get(r,'title'),description:get(r,'description'),price:p,rip,mod}});if(incoming.some(x=>!x.group||!x.title||!x.description||!Number.isFinite(x.price)||x.price<0||(!x.rip&&!x.mod)))throw Error('Alcune righe hanno dati mancanti o prezzi non validi');const codes=new Set(priceList.map(x=>x.code.toLowerCase()).filter(Boolean));for(const x of incoming){if(x.code&&codes.has(x.code.toLowerCase()))throw Error('Codice già presente: '+x.code);if(x.code)codes.add(x.code.toLowerCase())}if(!confirm(`Importare ${incoming.length} voci nel listino? Le voci esistenti non verranno modificate.`))return;const before=priceList.slice();priceList.push(...incoming);try{priceSave()}catch(err){priceList=before;throw err}priceListPage();alert('Importazione completata: '+incoming.length+' voci')}catch(err){alert('Importazione non riuscita: '+err.message)}};
 ['priceQuery','priceGroup','priceType'].forEach(k=>$(k).oninput=render);render();
 function render(){const q=$('priceQuery').value.toLocaleLowerCase('it'),g=$('priceGroup').value,t=$('priceType').value;const rows=priceList.filter(x=>(!g||x.group===g)&&(!t||(t==='RIP'?x.rip:x.mod))&&[x.code,x.group,x.title,x.description].join(' ').toLocaleLowerCase('it').includes(q)).sort((a,b)=>a.group.localeCompare(b.group,'it')||a.title.localeCompare(b.title,'it'));$('priceRows').innerHTML=rows.map(x=>`<tr><td>${esc(x.code||'—')}</td><td>${esc(x.group)}</td><td><strong>${esc(x.title)}</strong><div style="margin-top:5px"><button type="button" class="link" data-price-details="${esc(x.id)}" aria-expanded="false" style="font-size:12px">Mostra descrizione ▾</button><div data-price-description="${esc(x.id)}" class="muted" hidden style="max-width:650px;white-space:pre-line;font-size:12px;margin-top:8px;line-height:1.55">${esc(x.description)}</div></div></td><td>${x.image?`<img src="${esc(x.image)}" alt="Foto indicativa ${esc(x.title)}" class="price-thumb" loading="lazy">`:`<span class="muted">—</span>`}</td><td>${x.rip?'RIP ':''}${x.mod?'MOD':''}</td><td style="white-space:nowrap">${priceMoney(x.price)}</td><td><div class="line"><button class="link" data-price-edit="${esc(x.id)}">Modifica</button><button class="link" data-price-copy="${esc(x.id)}">Duplica</button><button class="link" data-price-del="${esc(x.id)}">Elimina</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nessuna voce trovata</td></tr>';
 document.querySelectorAll('[data-price-details]').forEach(b=>b.onclick=()=>{const detail=[...document.querySelectorAll('[data-price-description]')].find(x=>x.dataset.priceDescription===b.dataset.priceDetails);if(!detail)return;detail.hidden=!detail.hidden;b.setAttribute('aria-expanded',String(!detail.hidden));b.textContent=detail.hidden?'Mostra descrizione ▾':'Nascondi descrizione ▴'});document.querySelectorAll('[data-price-edit]').forEach(b=>b.onclick=()=>priceForm(b.dataset.priceEdit));document.querySelectorAll('[data-price-copy]').forEach(b=>b.onclick=()=>{const x=priceList.find(v=>v.id===b.dataset.priceCopy);if(x)priceForm(null,{...x,code:'',title:x.title+' (copia)'})});document.querySelectorAll('[data-price-del]').forEach(b=>b.onclick=()=>{const x=priceList.find(v=>v.id===b.dataset.priceDel);if(!x||!confirm(`Eliminare la voce "${x.title}"?`))return;const before=priceList.slice();priceList=priceList.filter(v=>v.id!==x.id);try{priceSave();priceListPage()}catch(err){priceList=before;alert('Eliminazione non riuscita')}})}
}
function priceForm(itemId,template){const old=priceList.find(x=>x.id===itemId)||template||{};page='listino';nav();$('title').textContent=itemId?'Modifica voce listino':'Nuova voce listino';$('subtitle').textContent='Riparazioni e modernizzazioni · importi IVA esclusa';const groups=[...new Set(priceList.map(x=>x.group).filter(Boolean))].sort();$('content').innerHTML=`<div class="panel"><h2>${itemId?'Modifica voce':'Crea voce preconfigurata'}</h2><form id="priceForm"><div>${input('code','Codice articolo (facoltativo)',old.code||'')}</div><div>${input('group','Gruppo *',old.group||'',true,'list="priceGroups"')}<datalist id="priceGroups">${groups.map(g=>`<option value="${esc(g)}"></option>`).join('')}</datalist></div><div class="full">${input('title','Titolo *',old.title||'',true)}</div><div class="full"><label for="priceDescription">Descrizione estesa *</label><textarea id="priceDescription" name="description" rows="7" required placeholder="Descrizione tecnica completa della lavorazione, materiali e prestazioni inclusi...">${esc(old.description||'')}</textarea></div><div class="full"><label for="priceImageFile">Foto del componente (facoltativa)</label><input id="priceImageFile" type="file" accept="image/jpeg,image/png,image/webp,image/*"><p class="note">Foto indicativa da utilizzare nei futuri preventivi. Formati JPG, PNG o WebP; immagine ridimensionata automaticamente. Le immagini sono conservate in questo browser.</p><div class="price-image-tools"><img id="priceImagePreview" alt="Anteprima foto componente" ${old.image?`src="${esc(old.image)}"`:''} ${old.image?'':'hidden'}><button type="button" class="btn secondary" id="priceRemoveImage" ${old.image?'':'hidden'}>Rimuovi foto</button><span id="priceImageStatus" class="note"></span></div></div><div>${input('price','Prezzo al cliente (€ IVA esclusa) *',old.price??'',true,'type="number" min="0" step="0.01"')}</div><div><label>Utilizzabile per *</label><div class="line"><label style="display:flex;gap:7px;align-items:center"><input type="checkbox" name="rip" style="width:auto" ${old.rip!==false?'checked':''}> RIP · Riparazioni</label><label style="display:flex;gap:7px;align-items:center"><input type="checkbox" name="mod" style="width:auto" ${old.mod!==false?'checked':''}> MOD · Modernizzazioni</label></div></div><div class="full line"><button class="btn" type="submit">Salva voce</button><button class="btn secondary" type="button" id="priceCancel">Annulla</button></div></form><p class="note">Puoi usare lo stesso gruppo per più voci (es. Porte di piano, Quadri di manovra, Funi e organi di sospensione). La descrizione estesa è pensata per essere riutilizzata nei preventivi.</p></div>`;let selectedPriceImage=old.image||'';const imageInput=$('priceImageFile'),imagePreview=$('priceImagePreview'),imageRemove=$('priceRemoveImage'),imageStatus=$('priceImageStatus');function updatePriceImage(){if(selectedPriceImage){imagePreview.src=selectedPriceImage;imagePreview.hidden=false;imageRemove.hidden=false}else{imagePreview.removeAttribute('src');imagePreview.hidden=true;imageRemove.hidden=true}}imageInput.onchange=async()=>{const f=imageInput.files?.[0];if(!f)return;imageStatus.textContent='Elaborazione immagine...';try{selectedPriceImage=await preparePriceImage(f);updatePriceImage();imageStatus.textContent='Foto pronta per il salvataggio'}catch(err){imageInput.value='';imageStatus.textContent='Errore: '+err.message}};imageRemove.onclick=()=>{selectedPriceImage='';imageInput.value='';updatePriceImage();imageStatus.textContent='Foto rimossa (salva per confermare)'};$('priceCancel').onclick=priceListPage;$('priceForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const data={code:String(fd.get('code')||'').trim(),group:String(fd.get('group')||'').trim(),title:String(fd.get('title')||'').trim(),description:String(fd.get('description')||'').trim(),price:Number(fd.get('price')),image:selectedPriceImage,rip:fd.has('rip'),mod:fd.has('mod')};if(!data.group||!data.title||!data.description||!Number.isFinite(data.price)||data.price<0)return alert('Completa i campi obbligatori e inserisci un prezzo valido');if(!data.rip&&!data.mod)return alert('Seleziona almeno RIP o MOD');if(data.code&&priceList.some(x=>x.id!==itemId&&x.code.toLowerCase()===data.code.toLowerCase()))return alert('Codice articolo già utilizzato');const before=JSON.stringify(priceList);if(itemId)Object.assign(priceList.find(x=>x.id===itemId),data);else priceList.push({id:id(),...data});try{priceSave();priceListPage()}catch(err){priceList=JSON.parse(before);alert('Impossibile salvare la voce: '+err.message)}}}
const _showBeforePrice=show;

/* SMA CRM 1.9.2 - Foto indicativa per voce di listino */
const priceImageCSS=document.createElement('style');priceImageCSS.textContent=`.price-thumb{width:52px;height:52px;object-fit:contain;border:1px solid #dedee4;border-radius:9px;background:#fff;display:block}.price-image-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px}.price-image-tools img{max-width:210px;max-height:155px;object-fit:contain;border:1px solid #dedee4;border-radius:12px;background:#fff;padding:5px}.price-image-tools [hidden]{display:none!important}`;document.head.appendChild(priceImageCSS);
async function preparePriceImage(file){
 if(!file.type.startsWith('image/'))throw Error('Seleziona un file immagine');
 if(file.size>12*1024*1024)throw Error('Immagine troppo grande (massimo 12 MB)');
 const url=URL.createObjectURL(file);
 try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Impossibile leggere l’immagine'));img.src=url});const max=900,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let quality=.78;let data=canvas.toDataURL('image/jpeg',quality);while(data.length>260000&&quality>.42){quality-=.1;data=canvas.toDataURL('image/jpeg',quality)}if(data.length>400000)throw Error('Immagine troppo complessa; prova una foto più piccola');return data}finally{URL.revokeObjectURL(url)}
}

show=function(p){if(p==='listino')return priceListPage();return _showBeforePrice(p)};

show(prefs.startPage||'dashboard');
</script></body></html>
