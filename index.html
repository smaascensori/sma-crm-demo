<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMA CRM 1.1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202127;background:#f5f5f7}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
aside{width:245px;background:#fff;border-right:1px solid #e7e7eb;padding:25px 15px;flex-shrink:0}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px;margin:0 10px 35px}
.logo span{color:#d71920}
nav button{width:100%;display:block;text-align:left;border:0;background:transparent;padding:13px;border-radius:11px;color:#52525b;margin:3px 0}
nav button.active{background:#fff0f0;color:#c71920;font-weight:700}
nav button:hover{background:#f3f3f5}
main{flex:1;min-width:0;padding:35px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}
h1{font-size:29px;letter-spacing:-1px;margin:0}
h2{font-size:20px}
.sub,.muted{color:#777}
.sub{margin:7px 0}
.btn{background:#ce1822;color:white;border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn.secondary{background:#ececf0;color:#333}
.btn.small{padding:7px 10px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card,.panel{background:white;border:1px solid #ececf0;border-radius:18px;padding:22px}
.card small{color:#777}
.card strong{display:block;font-size:27px;margin-top:12px}
.panel{margin-top:20px;overflow-x:auto}
table{border-collapse:collapse;width:100%;text-align:left}
th,td{padding:13px;border-bottom:1px solid #eee;font-size:14px}
th{color:#777;font-weight:600}
.tag{display:inline-block;padding:5px 9px;border-radius:8px;background:#f1f1f4;font-size:12px}
.green{background:#e7f7ed;color:#147a3b}
.blue{background:#e8f1ff;color:#245bb5}
form{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid #dddde3;border-radius:10px;padding:11px;background:#fff}
.full{grid-column:1/-1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.note{font-size:13px;color:#777;line-height:1.6}
.link{border:0;background:none;color:#c71920;font-weight:600;padding:0;text-align:left}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:15px}
details{border-top:1px solid #eee;padding-top:15px}
summary{cursor:pointer;font-weight:600}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}aside{width:205px}main{padding:20px}}
@media(max-width:650px){.app{display:block}aside{width:100%;padding:12px}nav{display:flex;overflow-x:auto;gap:5px}nav button{white-space:nowrap;width:auto}.logo{margin:5px 10px 15px}main{padding:15px}.cards{grid-template-columns:1fr 1fr}form{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="logo"><span>sma</span>ascensori</div>
<nav id="menu"></nav>
</aside>
<main>
<div class="top">
<div><h1 id="title">Dashboard</h1><p class="sub" id="subtitle">Panoramica commerciale</p></div>
<span class="tag">SMA CRM · Demo 1.1</span>
</div>
<div id="content"></div>
</main>
</div>
<script>
const sections=[
["dashboard","◫ Dashboard"],
["clienti","♙ Clienti"],
["contatti","♧ Contatti"],
["cantieri","▤ Progetti / Cantieri"],
["preventivi","▣ Preventivi"],
["ordini","✓ Conferme ordine"],
["newsletter","✉ Newsletter"],
["impostazioni","⚙ Impostazioni"]
];
const tipi=["Azienda","Privato","Professionista","Condominio","Impresa edile"];
let page="dashboard";
let records=[];
try{records=JSON.parse(localStorage.getItem("sma_demo_records")||"[]")}catch(e){records=[]}
if(!Array.isArray(records))records=[];
let selectedClient=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>typeof crypto!=="undefined"&&crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(36).slice(2);
function save(){localStorage.setItem("sma_demo_records",JSON.stringify(records))}
function isClient(r){return ["clienti","acquisiti","potenziali"].includes(r.type)}
function clientStatus(r){return r.status||(r.type==="acquisiti"?"Acquisito":"Potenziale")}
function clientName(id){return records.find(r=>r.id===id&&isClient(r))?.name||"Cliente non trovato"}
function menu(){
document.getElementById("menu").innerHTML=sections.map(([id,name])=>`<button class="${page===id?"active":""}" data-page="${id}">${name}</button>`).join("");
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>show(b.dataset.page));
}
function show(id){
page=id;selectedClient=null;menu();
document.getElementById("title").textContent=sections.find(s=>s[0]===id)[1].replace(/^[^ ]+ /,"");
document.getElementById("subtitle").textContent=id==="dashboard"?"Panoramica delle attività commerciali":"Gestione SMA Ascensori";
if(id==="dashboard")dashboard();
else if(id==="clienti")clientList();
else if(id==="cantieri")siteList();
else if(id==="contatti")contactList();
else document.getElementById("content").innerHTML='<div class="panel"><h2>Modulo in preparazione</h2><p class="sub">Questa sezione sarà sviluppata nelle prossime versioni.</p></div>';
}
function dashboard(){
const clients=records.filter(isClient),sites=records.filter(r=>r.type==="cantieri");
let acquired=clients.filter(r=>clientStatus(r)==="Acquisito").length;
let prospects=clients.length-acquired;
document.getElementById("content").innerHTML=`
<div class="cards">
${[["Clienti acquisiti",acquired],["Clienti potenziali",prospects],["Contatti",records.filter(r=>r.type==="contatti").length],["Cantieri",sites.length]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("")}
</div>
<div class="panel"><h2>Riepilogo commerciale</h2>
<table><thead><tr><th>Tipologia</th><th>Offerte</th><th>Ordini</th><th>Valore offerte</th></tr></thead>
<tbody>${["NI · Nuovi impianti","MOD · Ammodernamenti","RIP · Riparazioni","MAN · Manutenzioni"].map(x=>`<tr><td>${x}</td><td>0</td><td>0</td><td>€ 0,00</td></tr>`).join("")}</tbody></table>
<p class="note">Il modulo preventivi sarà collegato nelle versioni successive.</p></div>`;
}
function clientList(){
document.getElementById("content").innerHTML=`
<div class="actions"><button class="btn" id="add">+ Nuovo cliente</button><button class="btn secondary" id="export">Esporta CSV</button></div>
<div class="panel"><div class="toolbar">
<input id="search" placeholder="Cerca nome, comune, email...">
<select id="status"><option value="">Tutti gli stati</option><option>Potenziale</option><option>Acquisito</option></select>
<select id="kind"><option value="">Tutte le tipologie</option>${tipi.map(t=>`<option>${t}</option>`).join("")}</select>
</div><table><thead><tr><th>Cliente</th><th>Tipologia</th><th>Comune</th><th>Stato</th><th>Cantieri</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;
document.getElementById("add").onclick=()=>clientForm();
document.getElementById("export").onclick=()=>exportCSV(records.filter(isClient),"sma-clienti.csv");
["search","status","kind"].forEach(id=>document.getElementById(id).oninput=render);
render();
function render(){
let q=document.getElementById("search").value.toLowerCase(),st=document.getElementById("status").value,k=document.getElementById("kind").value;
let data=records.filter(isClient).filter(r=>(!st||clientStatus(r)===st)&&(!k||(r.kind||"Azienda")===k)&&[r.name,r.city,r.email,r.phone].join(" ").toLowerCase().includes(q));
document.getElementById("rows").innerHTML=data.map(r=>`<tr>
<td><button class="link" data-view="${esc(r.id)}">${esc(r.name)}</button></td>
<td>${esc(r.kind||"Azienda")}</td><td>${esc(r.city)}</td>
<td><span class="tag ${clientStatus(r)==="Acquisito"?"green":"blue"}">${esc(clientStatus(r))}</span></td>
<td>${records.filter(s=>s.type==="cantieri"&&s.clientId===r.id).length}</td>
<td><button class="btn secondary small" data-edit="${esc(r.id)}">Modifica</button></td></tr>`).join("")||'<tr><td colspan="6">Nessun cliente trovato</td></tr>';
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>clientDetail(b.dataset.view));
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>clientForm(b.dataset.edit));
}
}
function clientDetail(id){
let r=records.find(x=>x.id===id&&isClient(x));if(!r)return show("clienti");
let sites=records.filter(s=>s.type==="cantieri"&&s.clientId===id);
document.getElementById("content").innerHTML=`
<div class="actions"><button class="btn secondary" id="back">← Clienti</button><button class="btn" id="edit">Modifica cliente</button><button class="btn secondary" id="newsite">+ Nuovo cantiere</button></div>
<div class="panel"><h2>${esc(r.name)}</h2>
<p><span class="tag">${esc(r.kind||"Azienda")}</span> <span class="tag ${clientStatus(r)==="Acquisito"?"green":"blue"}">${esc(clientStatus(r))}</span></p>
<p>${esc(r.street)} ${esc(r.cap)} ${esc(r.city)} ${esc(r.province)}</p>
<p>Telefono: ${esc(r.phone)} · Email: ${esc(r.email)}</p>
${r.vat?`<p>Partita IVA: ${esc(r.vat)}</p>`:""}
${r.tax?`<p>Codice fiscale: ${esc(r.tax)}</p>`:""}
</div>
<div class="panel"><h2>Cantieri collegati (${sites.length})</h2>
<table><thead><tr><th>Riferimento</th><th>Comune</th><th>Indirizzo</th></tr></thead>
<tbody>${sites.map(s=>`<tr><td><button class="link" data-site="${esc(s.id)}">${esc(s.name)}</button></td><td>${esc(s.city)}</td><td>${esc(s.street)}</td></tr>`).join("")||'<tr><td colspan="3">Nessun cantiere collegato</td></tr>'}</tbody></table></div>`;
document.getElementById("back").onclick=()=>show("clienti");
document.getElementById("edit").onclick=()=>clientForm(id);
document.getElementById("newsite").onclick=()=>siteForm(null,id);
document.querySelectorAll("[data-site]").forEach(b=>b.onclick=()=>siteDetail(b.dataset.site));
}
function clientForm(id){
let old=records.find(r=>r.id===id&&isClient(r))||{};
document.getElementById("content").innerHTML=`
<div class="panel"><h2>${id?"Modifica":"Nuova"} anagrafica cliente</h2>
<form id="entry">
<div><label>Tipologia soggetto *</label><select name="kind" id="kind">${tipi.map(t=>`<option ${old.kind===t?"selected":""}>${t}</option>`).join("")}</select></div>
<div><label>Stato commerciale *</label><select name="status"><option ${clientStatus(old)==="Potenziale"?"selected":""}>Potenziale</option><option ${clientStatus(old)==="Acquisito"?"selected":""}>Acquisito</option></select></div>
${field("name","Ragione sociale / Nome *",old,true)}
${field("phone","Telefono *",old,true)}
${field("email","Email *",old,true,"email")}
${field("street","Via / Piazza e numero civico *",old,true)}
${field("cap","CAP *",old,true)}
${field("city","Comune *",old,true)}
${field("province","Provincia *",old,true)}
<div class="full"><details><summary>Dati aggiuntivi</summary>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:15px">
${field("vat","Partita IVA",old)}${field("tax","Codice fiscale",old)}
${field("pec","PEC",old)}${field("sdi","Codice SDI",old)}
${field("role","Qualifica / Albo",old)}${field("notes","Note",old)}
</div></details></div>
<div class="full"><button class="btn" type="submit">Salva cliente</button> <button type="button" class="btn secondary" id="back">Annulla</button></div>
</form></div>`;
document.getElementById("back").onclick=()=>id?clientDetail(id):show("clienti");
document.getElementById("entry").onsubmit=e=>{
e.preventDefault();let data=Object.fromEntries(new FormData(e.target));
if(id)Object.assign(old,data,{type:"clienti"});
else{let r={id:uid(),type:"clienti",...data};records.push(r);id=r.id}
save();clientDetail(id);
};
}
function field(key,label,old,required=false,inputType="text"){
return `<div><label>${label}</label><input name="${key}" type="${inputType}" value="${esc(old[key]||"")}" ${required?"required":""}></div>`;
}
function siteList(){
let sites=records.filter(r=>r.type==="cantieri");
document.getElementById("content").innerHTML=`
<div class="actions"><button class="btn" id="add">+ Nuovo cantiere</button><button class="btn secondary" id="export">Esporta CSV</button></div>
<div class="panel"><input id="search" placeholder="Cerca cantiere, cliente o comune...">
<table><thead><tr><th>Cantiere</th><th>Cliente collegato</th><th>Comune</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;
document.getElementById("add").onclick=()=>siteForm();
document.getElementById("export").onclick=()=>exportCSV(sites,"sma-cantieri.csv");
document.getElementById("search").oninput=render;
render();
function render(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("rows").innerHTML=sites.filter(r=>[r.name,r.city,clientName(r.clientId)].join(" ").toLowerCase().includes(q)).map(r=>`
<tr><td><button class="link" data-site="${esc(r.id)}">${esc(r.name)}</button></td>
<td>${r.clientId?`<button class="link" data-client="${esc(r.clientId)}">${esc(clientName(r.clientId))}</button>`:'<span class="muted">Da collegare</span>'}</td>
<td>${esc(r.city)}</td><td><button class="btn secondary small" data-edit="${esc(r.id)}">Modifica</button></td></tr>`).join("")||'<tr><td colspan="4">Nessun cantiere trovato</td></tr>';
document.querySelectorAll("[data-site]").forEach(b=>b.onclick=()=>siteDetail(b.dataset.site));
document.querySelectorAll("[data-client]").forEach(b=>b.onclick=()=>clientDetail(b.dataset.client));
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>siteForm(b.dataset.edit));
}
}
function siteDetail(id){
let r=records.find(x=>x.id===id&&x.type==="cantieri");if(!r)return show("cantieri");
document.getElementById("content").innerHTML=`
<div class="actions"><button class="btn secondary" id="back">← Cantieri</button><button class="btn" id="edit">Modifica cantiere</button></div>
<div class="panel"><h2>${esc(r.name)}</h2>
<p>${esc(r.street)} · ${esc(r.cap)} ${esc(r.city)} (${esc(r.province)})</p>
<p><strong>Cliente collegato:</strong> ${r.clientId?`<button class="link" id="client">${esc(clientName(r.clientId))}</button>`:'<span class="muted">Non ancora collegato</span>'}</p>
${r.finalClient?`<p>Committente finale: ${esc(r.finalClient)}</p>`:""}
<p class="note">${esc(r.notes)}</p></div>`;
document.getElementById("back").onclick=()=>show("cantieri");
document.getElementById("edit").onclick=()=>siteForm(id);
if(r.clientId&&document.getElementById("client"))document.getElementById("client").onclick=()=>clientDetail(r.clientId);
}
function siteForm(id,defaultClient){
let old=records.find(r=>r.id===id&&r.type==="cantieri")||{};
let clients=records.filter(isClient);
document.getElementById("content").innerHTML=`
<div class="panel"><h2>${id?"Modifica":"Nuovo"} cantiere</h2>
${!clients.length?'<p class="note">Per creare un cantiere occorre prima registrare un cliente.</p>':""}
<form id="entry">
<div class="full"><label>Cliente collegato *</label>
<select name="clientId" required><option value="">Seleziona cliente...</option>
${clients.map(c=>`<option value="${esc(c.id)}" ${(old.clientId||defaultClient)===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
${field("name","Riferimento cantiere *",old,true)}
${field("street","Indirizzo e numero civico *",old,true)}
${field("cap","CAP *",old,true)}
${field("city","Comune *",old,true)}
${field("province","Provincia *",old,true)}
${field("finalClient","Committente finale (facoltativo)",old)}
${field("notes","Note",old)}
<div class="full"><button class="btn" type="submit" ${!clients.length?"disabled":""}>Salva cantiere</button>
<button class="btn secondary" type="button" id="back">Annulla</button></div>
</form></div>`;
document.getElementById("back").onclick=()=>id?siteDetail(id):show("cantieri");
document.getElementById("entry").onsubmit=e=>{
e.preventDefault();let data=Object.fromEntries(new FormData(e.target));
if(!records.some(r=>isClient(r)&&r.id===data.clientId)){alert("Seleziona un cliente valido");return}
if(id)Object.assign(old,data);
else{id=uid();records.push({id,type:"cantieri",...data})}
save();siteDetail(id);
};
}
function contactList(){
let rows=records.filter(r=>r.type==="contatti");
document.getElementById("content").innerHTML=`
<div class="actions"><button class="btn" id="add">+ Nuovo contatto</button><button class="btn secondary" id="export">Esporta CSV</button></div>
<div class="panel"><table><thead><tr><th>Nome</th><th>Comune</th><th>Email</th><th>Telefono</th><th></th></tr></thead>
<tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.city)}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td>
<td><button class="btn secondary small" data-edit="${esc(r.id)}">Modifica</button></td></tr>`).join("")||'<tr><td colspan="5">Nessun contatto presente</td></tr>'}</tbody></table></div>`;
document.getElementById("add").onclick=()=>contactForm();
document.getElementById("export").onclick=()=>exportCSV(rows,"sma-contatti.csv");
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>contactForm(b.dataset.edit));
}
function contactForm(id){
let old=records.find(r=>r.id===id&&r.type==="contatti")||{};
document.getElementById("content").innerHTML=`<div class="panel"><h2>${id?"Modifica":"Nuovo"} contatto</h2>
<form id="entry">${field("name","Nome e cognome *",old,true)}${field("phone","Telefono *",old,true)}
${field("email","Email *",old,true,"email")}${field("city","Comune *",old,true)}
${field("role","Ruolo",old)}${field("notes","Note",old)}
<div class="full"><button class="btn" type="submit">Salva</button> <button class="btn secondary" type="button" id="back">Annulla</button></div></form></div>`;
document.getElementById("back").onclick=()=>show("contatti");
document.getElementById("entry").onsubmit=e=>{
e.preventDefault();let data=Object.fromEntries(new FormData(e.target));
if(id)Object.assign(old,data);
else records.push({id:uid(),type:"contatti",...data});
save();show("contatti");
};
}
function exportCSV(data,filename){
let keys=["name","kind","status","clientId","phone","email","street","cap","city","province","vat","tax","notes"];
let csv=[keys.join(";"),...data.map(r=>keys.map(k=>'"'+String(r[k]||"").replace(/"/g,'""')+'"').join(";"))].join("\r\n");
let blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* SMA CRM 1.2 - Logo e importazione clienti */
(function(){
  const logo=document.querySelector(".logo");
  if(logo){
    logo.innerHTML='<img src="LOGO_SMA_standard.jpg" alt="SMA Ascensori" style="width:100%;height:auto;display:block">';
    logo.style.margin="0 8px 30px";
  }

  const oldListClients=listClients;
  clientList=function(){
    oldListClients();
    const exportButton=document.getElementById("export");
    if(exportButton){
      const button=document.createElement("button");
      button.className="btn secondary";
      button.textContent="↑ Importa Excel / CSV";
      button.onclick=openImport;
      exportButton.before(button);
    }
  };

  const fields=[
    ["name","Ragione sociale / Nome",true],
    ["kind","Tipologia soggetto",false],
    ["status","Stato commerciale",false],
    ["phone","Telefono",true],
    ["email","Email",true],
    ["street","Indirizzo e numero civico",true],
    ["cap","CAP",true],
    ["city","Comune",true],
    ["province","Provincia",true],
    ["vat","Partita IVA",false],
    ["taxCode","Codice fiscale",false],
    ["pec","PEC",false],
    ["sdi","Codice SDI",false],
    ["notes","Note",false]
  ];
  const aliases={
    name:["ragione sociale","denominazione","nome","cliente","nominativo","azienda"],
    kind:["tipologia","tipo","categoria","tipo cliente"],
    status:["stato","stato commerciale","status"],
    phone:["telefono","cellulare","tel","mobile"],
    email:["email","e-mail","mail"],
    street:["indirizzo","via","indirizzo completo","sede"],
    cap:["cap","codice postale"],
    city:["comune","citta","città","localita"],
    province:["provincia","sigla provincia","prov"],
    vat:["partita iva","piva","p.iva"],
    taxCode:["codice fiscale","cf","c.f."],
    pec:["pec"],
    sdi:["sdi","codice destinatario"],
    notes:["note","annotazioni"]
  };
  let importedRows=[],headers=[],mapping={};

  const clean=s=>String(s??"").trim();
  const norm=s=>clean(s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");

  function openImport(){
    document.getElementById("title").textContent="Importa clienti";
    document.getElementById("subtitle").textContent="Excel e CSV · Anteprima e verifica dati";
    document.getElementById("content").innerHTML=`
      <div class="panel">
        <h2>Importazione anagrafiche</h2>
        <p class="note">Seleziona un file .xlsx, .xls oppure .csv.
        Controlla le colonne e i dati prima di confermare.</p>
        <input id="impFile" type="file" accept=".xlsx,.xls,.csv">
        <div class="actions" style="margin-top:16px">
          <button class="btn secondary" id="impTemplate">Scarica modello CSV</button>
          <button class="btn secondary" id="impBack">← Torna ai clienti</button>
        </div>
      </div>
      <div id="impResult"></div>`;
    document.getElementById("impBack").onclick=()=>show("clienti");
    document.getElementById("impTemplate").onclick=template;
    document.getElementById("impFile").onchange=async e=>{
      const file=e.target.files[0];
      if(!file)return;
      try{
        if(/\.csv$/i.test(file.name)){
          let text=await file.text();
          const matrix=parseCSV(text.replace(/^\uFEFF/,""));
          prepare(matrix);
        }else{
          await loadXLSX();
          const data=await file.arrayBuffer();
          const book=XLSX.read(data,{type:"array",cellDates:false});
          const sheet=book.Sheets[book.SheetNames[0]];
          const matrix=XLSX.utils.sheet_to_json(sheet,{
            header:1,defval:"",raw:false
          });
          prepare(matrix);
        }
      }catch(err){
        document.getElementById("impResult").innerHTML=
          '<div class="panel">Impossibile leggere il file: '+
          esc(err.message)+'</div>';
      }
    };
  }

  function loadXLSX(){
    if(window.XLSX)return Promise.resolve();
    return new Promise((resolve,reject)=>{
      const s=document.createElement("script");
      s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
      s.onload=()=>window.XLSX?resolve():reject(Error("Libreria Excel non disponibile"));
      s.onerror=()=>reject(Error("Connessione alla libreria Excel non riuscita. Prova con CSV."));
      document.head.appendChild(s);
    });
  }

  function parseCSV(text){
    const first=text.split(/\r?\n/)[0]||"";
    const delimiter=[";",",","\t"].sort((a,b)=>
      first.split(b).length-first.split(a).length)[0];
    const result=[];
    let row=[],cell="",quoted=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(ch==='"'){
        if(quoted&&text[i+1]==='"'){cell+='"';i++}
        else quoted=!quoted;
      }else if(ch===delimiter&&!quoted){
        row.push(cell);cell="";
      }else if((ch==="\n"||ch==="\r")&&!quoted){
        if(ch==="\r"&&text[i+1]==="\n")i++;
        row.push(cell);cell="";
        if(row.some(x=>clean(x)))result.push(row);
        row=[];
      }else cell+=ch;
    }
    row.push(cell);
    if(row.some(x=>clean(x)))result.push(row);
    return result;
  }

  function prepare(matrix){
    if(matrix.length<2)throw Error("Il file non contiene righe da importare.");
    headers=matrix[0].map(clean);
    importedRows=matrix.slice(1).filter(r=>r.some(x=>clean(x)));
    mapping={};
    fields.forEach(([key])=>{
      const options=[key,...(aliases[key]||[])].map(norm);
      const index=headers.findIndex(h=>options.includes(norm(h)));
      mapping[key]=index>=0?String(index):"";
    });
    drawMapping();
  }

  function drawMapping(){
    document.getElementById("impResult").innerHTML=`
      <div class="panel">
        <h2>1. Associa le colonne</h2>
        <p class="note">${importedRows.length} righe individuate.
        Verifica gli abbinamenti proposti automaticamente.</p>
        <div id="impMappings" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px"></div>
        <div class="actions" style="margin-top:20px">
          <button class="btn" id="impPreview">Verifica dati →</button>
        </div>
      </div>`;
    const target=document.getElementById("impMappings");
    fields.forEach(([key,label,required])=>{
      const wrap=document.createElement("div");
      const lab=document.createElement("label");
      lab.textContent=label+(required?" *":"");
      const sel=document.createElement("select");
      sel.dataset.field=key;
      sel.add(new Option("Non importare",""));
      headers.forEach((h,i)=>sel.add(new Option(h||"Colonna "+(i+1),String(i))));
      sel.value=mapping[key];
      sel.onchange=()=>mapping[key]=sel.value;
      wrap.append(lab,sel);
      target.appendChild(wrap);
    });
    document.getElementById("impPreview").onclick=preview;
  }

  function normalizeKind(value){
    const v=norm(value);
    if(v.includes("edil")||v.includes("costruz"))return "Impresa edile";
    if(v.includes("condomin"))return "Condominio";
    if(v.includes("profession")||v.includes("studio")||v.includes("ingegn")||v.includes("architet"))return "Professionista";
    if(v.includes("privat")||v.includes("persona"))return "Privato";
    return "Azienda";
  }

  function normalizeStatus(value){
    const v=norm(value);
    return ["acquisito","acquisiti","cliente","attivo","customer"].includes(v)
      ?"acquisito":"potenziale";
  }

  function buildRows(){
    return importedRows.map((row,i)=>{
      const r={};
      fields.forEach(([key])=>{
        r[key]=mapping[key]===""?"":clean(row[Number(mapping[key])]);
      });
      r.kind=r.kind?normalizeKind(r.kind):
        document.getElementById("impKind").value;
      r.status=r.status?normalizeStatus(r.status):
        document.getElementById("impStatus").value;
      r._row=i+2;
      r._errors=[];
      ["name","phone","email","street","cap","city","province"].forEach(k=>{
        if(!r[k])r._errors.push(k);
      });
      if(r.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email))
        r._errors.push("email non valida");
      r._match=findDuplicate(r);
      return r;
    });
  }

  function findDuplicate(r){
    const same=(a,b)=>norm(a)&&norm(a)===norm(b);
    return records.filter(isClient).find(c=>
      (r.vat&&same(r.vat,c.vat))||
      (r.taxCode&&same(r.taxCode,c.taxCode))||
      (same(r.name,c.name)&&
        same(r.street,c.street)&&same(r.city,c.city))
    );
  }

  function preview(){
    const missing=fields.filter(([k,,required])=>required&&mapping[k]==="");
    if(missing.length){
      alert("Associa prima le colonne obbligatorie: "+
        missing.map(x=>x[1]).join(", "));
      return;
    }
    const target=document.getElementById("impResult");
    target.innerHTML=`
      <div class="panel">
        <h2>2. Controlla le anagrafiche</h2>
        <div class="filters">
          <div><label>Tipologia predefinita</label>
            <select id="impKind">${["Azienda","Privato","Professionista","Condominio","Impresa edile"].map(x=>`<option>${x}</option>`).join("")}</select></div>
          <div><label>Stato predefinito</label>
            <select id="impStatus"><option value="potenziale">Potenziale</option><option value="acquisito">Acquisito</option></select></div>
          <div><label>Clienti duplicati</label>
            <select id="impDuplicates"><option value="skip">Ignora duplicati</option><option value="update">Aggiorna esistenti</option></select></div>
        </div>
        <div id="impTable"></div>
        <div class="actions" style="margin-top:18px">
          <button class="btn" id="impConfirm">Conferma importazione</button>
          <button class="btn secondary" id="impRemap">← Modifica colonne</button>
        </div>
        <p class="note">Le righe con errori non saranno importate.
        I dati restano salvati esclusivamente in questo browser.</p>
      </div>`;
    const redraw=()=>{
      const rows=buildRows();
      const errors=rows.filter(r=>r._errors.length).length;
      const duplicates=rows.filter(r=>r._match).length;
      document.getElementById("impTable").innerHTML=`
        <p><strong>${rows.length}</strong> righe ·
        <strong>${errors}</strong> con errori ·
        <strong>${duplicates}</strong> possibili duplicati</p>
        <div style="overflow-x:auto;max-height:430px">
        <table><thead><tr><th>Riga</th><th>Cliente</th><th>Comune</th><th>Tipologia</th><th>Esito</th></tr></thead>
        <tbody>${rows.slice(0,200).map(r=>`
          <tr><td>${r._row}</td><td>${esc(r.name)}</td>
          <td>${esc(r.city)}</td><td>${esc(r.kind)}</td>
          <td>${r._errors.length?
            '<span style="color:#c71920">Mancano: '+esc(r._errors.join(", "))+'</span>':
            r._match?'<span style="color:#a66a00">Duplicato</span>':
            '<span style="color:#147a3b">Valido</span>'}</td></tr>`).join("")}</tbody></table></div>
        ${rows.length>200?'<p class="note">Visualizzate le prime 200 righe.</p>':""}`;
    };
    ["impKind","impStatus"].forEach(k=>
      document.getElementById(k).onchange=redraw);
    document.getElementById("impRemap").onclick=drawMapping;
    document.getElementById("impConfirm").onclick=confirmImport;
    redraw();
  }

  function confirmImport(){
    const rows=buildRows();
    const mode=document.getElementById("impDuplicates").value;
    let added=0,updated=0,skipped=0;
    const seen=new Set();
    const valid=rows.filter(r=>!r._errors.length);
    for(const r of valid){
      const key=norm(r.vat)||norm(r.taxCode)||
        norm(r.name)+"|"+norm(r.street)+"|"+norm(r.city);
      if(seen.has(key)){skipped++;continue}
      seen.add(key);
      const old=findDuplicate(r);
      const data={...r};
      delete data._row;delete data._errors;delete data._match;
      if(old){
        if(mode==="update"){
          for(const [k,v] of Object.entries(data)){
            if(v)old[k]=v;
          }
          updated++;
        }else skipped++;
      }else{
        records.push({id:uid(),type:"clienti",...data});
        added++;
      }
    }
    try{
      save();
      alert("Importazione completata.\n"+
        "Nuovi clienti: "+added+"\n"+
        "Aggiornati: "+updated+"\n"+
        "Ignorati/duplicati: "+skipped+"\n"+
        "Righe con errori: "+(rows.length-valid.length));
      show("clienti");
    }catch(e){
      alert("Salvataggio non riuscito. Potrebbe essere esaurito lo spazio del browser.");
    }
  }

  function template(){
    const cols=fields.map(x=>x[0]);
    const blob=new Blob(["\uFEFF"+cols.join(";")+"\r\n"],{
      type:"text/csv;charset=utf-8"
    });
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="modello-importazione-clienti-sma.csv";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
})();
show("dashboard");
</script>
