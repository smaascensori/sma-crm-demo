<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMA CRM 2.8</title><style>

splay:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #dcdce2;border-radius:10px;padding:11px;background:#fff}textarea{min-height:90px}.full{grid-column:1/-1}.note{font-size:13px;color:#777;line-height:1.6}.link{border:0;background:none;color:#bd1722;font-weight:600;text-align:left;padding:0}.empty{padding:24px;color:#777}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.pill{font-size:12px;color:#888}.divider{height:1px;background:#eee;margin:22px 0}@media(max-width:950px){aside{width:205px}main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}aside{width:100%;padding:12px}nav{display:flex;overflow-x:auto}nav button{width:auto;white-space:nowrap}.logo{margin:5px 10px 15px}main{padding:15px}.filters,form{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}

'use strict';const K='sma_demo_records';let records=[];try{const v=JSON.parse(localStorage.getItem(K)||'[]');records=Array.isArray(v)?v:[]}catch(e){alert('Impossibile leggere le anagrafiche salvate. Non sono state sovrascritte.')}const sections=[['dashboard','◫ Dashboard'],['clienti','♙ Clienti'],['contatti','☷ Contatti'],['agenti','♟ Agenti'],['cantieri','▤ Progetti / Cantieri'],['preventivi','▣ Preventivi'],['ordini','✓ Conferme ordine'],['newsletter','✉ Newsletter'],['listino','▦ Listino prezzi'],['impostazioni','⚙ Impostazioni']];let page='dashboard';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);function persist(){localStorage.setItem(K,JSON.stringify(records))}function isClient(r){return ['clienti','acquisiti','potenziali'].includes(r.type)}function status(r){return r.status||(r.type==='acquisiti'?'acquisito':'potenziale')}function clients(){return records.filter(isClient)}function sites(){return records.filter(r=>r.type==='cantieri')}function clientName(clientId){return clients().find(r=>r.id===clientId)?.name||'Cliente non collegato'}function nav(){ $('menu').innerHTML=sections.map(([k,v])=>`<button class="${page===k?'active':''}" data-nav="${k}">${v}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav))}function show(p){page=p;nav();$('title').textContent=sections.find(s=>s[0]===p)?.[1].replace(/^[^ ]+ /,'')||p;$('subtitle').textContent=p==='dashboard'?'Panoramica delle attività commerciali':'Gestione SMA Ascensori';if(p==='dashboard')dashboard();else if(p==='clienti')listClients();else if(p==='cantieri')listSites();else if(p==='contatti')listContacts();else if(p==='agenti')agentList();else $('content').innerHTML='<div class="panel"><h2>Modulo in preparazione</h2><p class="muted">La funzionalità sarà implementata nelle prossime versioni.</p></div>'}function dashboard(){let c=clients(),s=sites();$('content').innerHTML=`<div class="cards">${[['Clienti acquisiti',c.filter(r=>status(r)==='acquisito').length],['Clienti potenziali',c.filter(r=>status(r)==='potenziale').length],['Contatti',records.filter(r=>r.type==='contatti').length],['Cantieri',s.length]].map(([t,n])=>`<div class="card"><small>${t}</small><strong>${n}</strong></div>`).join('')}</div><div class="panel"><h2>Riepilogo commerciale</h2><table><thead><tr><th>Tipologia</th><th>Offerte</th><th>Ordini</th><th>Valore offerte</th></tr></thead><tbody>${['NI · Nuovi impianti','MOD · Ammodernamenti','RIP · Riparazioni','MAN · Manutenzioni'].map(t=>`<tr><td>${t}</td><td>0</td><td>0</td><td>€ 0,00</td></tr>`).join('')}</tbody></table><p class="note">I moduli preventivi e ordini saranno collegati in una fase successiva.</p></div>`}function listClients(){let c=clients();$('content').innerHTML=`<div class="actions"><button class="btn" id="add">+ Nuovo cliente</button><button class="btn secondary" id="export">Esporta CSV</button><button class="btn secondary" id="import">Importa Excel / CSV</button></div><div class="panel"><h2>Anagrafiche clienti</h2><div class="filters"><input id="q" placeholder="Cerca ragione sociale, comune, email..."><select id="st"><option value="">Tutti gli stati</option><option value="potenziale">Potenziali</option><option value="acquisito">Acquisiti</option></select><select id="kind"><option value="">Tutte le tipologie</option>${['Azienda','Privato','Professionista','Condominio','Impresa edile'].map(x=>`<option>${x}</option>`).join('')}</select></div><table><thead><tr><th>Cliente</th><th>Tipologia</th><th>Comune</th><th>Stato</th><th>Cantieri</th></tr></thead><tbody id="rows"></tbody></table></div>`;$('add').onclick=()=>clientForm();$('export').onclick=exportClients;$('import').onclick=importClients;['q','st','kind'].forEach(k=>$(k).oninput=render);render();function render(){let q=$('q').value.toLowerCase(),st=$('st').value,kind=$('kind').value;let out=c.filter(r=>(!st||status(r)===st)&&(!kind||r.kind===kind)&&[r.name,r.city,r.email,r.phone,r.vat].join(' ').toLowerCase().includes(q));$('rows').innerHTML=out.map(r=>`<tr><td><button class="link" data-id="${esc(r.id)}">${esc(r.name)}</button><div class="pill">${esc(r.email)}</div></td><td>${esc(r.kind||'Non specificata')}</td><td>${esc(r.city)}</td><td><span class="tag ${status(r)==='acquisito'?'ok':'lead'}">${status(r)==='acquisito'?'Acquisito':'Potenziale'}</span></td><td>${sites().filter(s=>s.clientId===r.id).length}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nessuna anagrafica trovata</td></tr>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>clientDetail(b.dataset.id))}}function input(name,label,value='',required=false,opts=''){return `<div><label for="f_${name}">${label}${required?' *':''}</label><input id="f_${name}" name="${name}" value="${esc(value)}" ${required?'required':''} ${opts}></div>`}function select(name,label,options,value){return `<div><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}function clientForm(clientId){let old=clients().find(r=>r.id===clientId)||{};$('title').textContent=clientId?'Modifica cliente':'Nuovo cliente';$('content').innerHTML=`<div class="panel"><h2>Dati anagrafici</h2><form id="entry">${select('kind','Tipologia soggetto *',['Azienda','Privato','Professionista','Condominio','Impresa edile'],old.kind||'Azienda')}${select('status','Stato commerciale *',['potenziale','acquisito'],status(old))}<div class="full" id="namelabel">${input('name','Ragione sociale / Denominazione',old.name,true)}</div>${input('phone','Telefono',old.phone,true)}${input('email','Email',old.email,true,'type="email"')}${input('street','Via / Piazza e numero civico',old.street,true)}${input('cap','CAP',old.cap,true)}${input('city','Comune',old.city,true)}${input('province','Provincia',old.province,true)}${input('vat','Partita IVA',old.vat)}${input('taxCode','Codice fiscale',old.taxCode)}${input('pec','PEC',old.pec)}${input('sdi','Codice SDI',old.sdi)}${input('role','Qualifica / Albo',old.role)}${input('contactPerson','Referente',old.contactPerson)}<div class="full"><label>Note</label><textarea name="notes">${esc(old.notes)}</textarea></div><div class="full line"><button class="btn" type="submit">Salva cliente</button><button class="btn secondary" type="button" id="cancel">Annulla</button></div></form><p class="note">I dati sono salvati solo in questo browser. Non inserire dati aziendali reali nella demo pubblica.</p></div>`;const updateName=()=>{let kind=$('f_kind').value;let lab=kind==='Privato'?'Nome e cognome':kind==='Professionista'?'Nome, cognome e qualifica':kind==='Condominio'?'Denominazione condominio':'Ragione sociale';document.querySelector('label[for="f_name"]').textContent=lab+' *'};$('f_kind').onchange=updateName;updateName();setupAddressAutocomplete();$('cancel').onclick=()=>clientId?clientDetail(clientId):show('clienti');$('entry').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(clientId){Object.assign(old,obj,{type:'clienti'})}else records.push({id:id(),type:'clienti',...obj});persist();show('clienti')}}function clientDetail(clientId){let c=clients().find(r=>r.id===clientId);if(!c)return show('clienti');$('title').textContent=c.name;$('subtitle').textContent='Scheda cliente · '+(c.kind||'Tipologia non specificata');let linked=sites().filter(s=>s.clientId===clientId);$('content').innerHTML=`<div class="actions"><button class="btn secondary" id="back">← Tutti i clienti</button><button class="btn" id="edit">Modifica cliente</button><button class="btn secondary" id="newsite">+ Nuovo cantiere collegato</button></div><div class="panel"><h2>Informazioni cliente</h2><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><p class="muted">Stato commerciale</p><strong>${status(c)==='acquisito'?'Acquisito':'Potenziale'}</strong></div><div><p class="muted">Tipologia</p><strong>${esc(c.kind||'Non specificata')}</strong></div><div><p class="muted">Contatti</p>${esc(c.email)}<br>${esc(c.phone)}</div><div><p class="muted">Indirizzo</p>${esc(c.street)} ${esc(c.cap)} ${esc(c.city)} (${esc(c.province)})</div></div></div><div class="panel"><h2>Contatti collegati</h2><table><tbody>${records.filter(r=>r.type==='contatti'&&(r.clientLinks||[]).some(l=>l.clientId===clientId)).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc((r.clientLinks||[]).find(l=>l.clientId===clientId)?.role||r.role||'')}</td><td>${esc(r.phone)}</td></tr>`).join('')||'<tr><td class="empty">Nessun contatto collegato</td></tr>'}</tbody></table></div><div class="panel"><h2>Cantieri collegati (${linked.length})</h2><table><thead><tr><th>Riferimento</th><th>Comune</th><th>Indirizzo</th></tr></thead><tbody>${linked.map(s=>`<tr><td><button class="link" data-site="${esc(s.id)}">${esc(s.name)}</button></td><td>${esc(s.city)}</td><td>${esc(s.street)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nessun cantiere collegato</td></tr>'}</tbody></table></div>`;$('back').onclick=()=>show('clienti');$('edit').onclick=()=>clientForm(clientId);$('newsite').onclick=()=>siteForm(null,clientId);document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>siteDetail(b.dataset.site))}function listSites(){let all=sites();$('content').innerHTML=`<div class="actions"><button class="btn" id="add">+ Nuovo cantiere</button><button class="btn secondary" id="export">Esporta CSV</button></div><div class="panel"><h2>Progetti e cantieri</h2><input id="q" placeholder="Cerca cantiere, comune o cliente..."><table><thead><tr><th>Cantiere</th><th>Cliente collegato</th><th>Comune</th><th>Indirizzo</th></tr></thead><tbody id="rows"></tbody></table></div>`;$('add').onclick=()=>siteForm();$('export').onclick=exportSites;$('q').oninput=render;render();function render(){let q=$('q').value.toLowerCase();let out=all.filter(r=>[r.name,r.city,r.street,clientName(r.clientId)].join(' ').toLowerCase().includes(q));$('rows').innerHTML=out.map(r=>`<tr><td><button class="link" data-site="${esc(r.id)}">${esc(r.name)}</button></td><td>${r.clientId&&clients().some(c=>c.id===r.clientId)?`<button class="link" data-client="${esc(r.clientId)}">${esc(clientName(r.clientId))}</button>`:'<span class="muted">Da collegare</span>'}</td><td>${esc(r.city)}</td><td>${esc(r.street)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nessun cantiere trovato</td></tr>';document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>siteDetail(b.dataset.site));document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>clientDetail(b.dataset.client))}}function siteForm(siteId,initialClientId){let old=sites().find(r=>r.id===siteId)||{},all=clients();$('title').textContent=siteId?'Modifica cantiere':'Nuovo cantiere';$('content').innerHTML=`<div class="panel"><h2>Dati cantiere</h2><form id="entry"><div class="full"><label>Cliente collegato *</label><select name="clientId" required><option value="">Seleziona un cliente...</option>${all.map(c=>`<option value="${esc(c.id)}" ${c.id===(old.clientId||initialClientId)?'selected':''}>${esc(c.name)}</option>`).join('')}</select><p class="note">Il cliente deve essere già presente nell'anagrafica.</p></div><div class="full">${input('name','Nome / Riferimento cantiere',old.name,true)}</div>${input('street','Via / Piazza e numero civico',old.street,true)}${input('cap','CAP',old.cap,true)}${input('city','Comune',old.city,true)}${input('province','Provincia',old.province,true)}${input('contactPerson','Referente cantiere',old.contactPerson)}${input('finalCustomer','Committente finale (facoltativo)',old.finalCustomer)}<div class="full"><label>Note</label><textarea name="notes">${esc(old.notes)}</textarea></div><div class="full line"><button class="btn" type="submit" ${!all.length?'disabled':''}>Salva cantiere</button><button class="btn secondary" type="button" id="cancel">Annulla</button></div></form>${!all.length?'<p class="note">Prima crea almeno un cliente nella sezione Clienti.</p>':''}</div>`;setupAddressAutocomplete();$('cancel').onclick=()=>siteId?siteDetail(siteId):initialClientId?clientDetail(initialClientId):show('cantieri');$('entry').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(!all.some(c=>c.id===obj.clientId))return alert('Seleziona un cliente valido');if(siteId)Object.assign(old,obj);else records.push({id:id(),type:'cantieri',...obj});persist();show('cantieri')}}function siteDetail(siteId){let s=sites().find(r=>r.id===siteId);if(!s)return show('cantieri');$('title').textContent=s.name;$('subtitle').textContent='Scheda progetto / cantiere';let c=clients().find(x=>x.id===s.clientId);$('content').innerHTML=`<div class="actions"><button class="btn secondary" id="back">← Tutti i cantieri</button><button class="btn" id="edit">Modifica cantiere</button></div><div class="panel"><h2>Cliente collegato</h2>${c?`<button class="link" id="openClient">${esc(c.name)}</button><p class="note">${esc(c.kind||'')} · ${esc(c.email||'')}</p>`:'<p class="muted">Questo cantiere proviene dalla versione precedente: seleziona un cliente con “Modifica cantiere”.</p>'}<div class="divider"></div><h2>Ubicazione del cantiere</h2><p>${esc(s.street)}, ${esc(s.cap)} ${esc(s.city)} (${esc(s.province)})</p><p class="note">Committente finale: ${esc(s.finalCustomer||'Non indicato')}<br>Referente: ${esc(s.contactPerson||'Non indicato')}</p><p>${esc(s.notes||'')}</p></div>`;$('back').onclick=()=>show('cantieri');$('edit').onclick=()=>siteForm(siteId);if(c)$('openClient').onclick=()=>clientDetail(c.id)}function listContacts(){let c=records.filter(r=>r.type==='contatti');$('content').innerHTML=`<div class="actions"><button class="btn" id="add">+ Nuovo contatto</button></div><div class="panel"><h2>Contatti</h2><table><thead><tr><th>Nome</th><th>Telefono</th><th>Email</th><th>Comune</th><th>Clienti collegati</th></tr></thead><tbody>${c.map(r=>`<tr><td><button class="link" data-contact="${esc(r.id)}">${esc(r.name)}</button></td><td>${esc(r.phone)}</td><td>${esc(r.email)}</td><td>${esc(r.city)}</td><td>${(r.clientLinks||[]).map(l=>esc(clientName(l.clientId))).join(', ')||'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nessun contatto</td></tr>'}</tbody></table></div>`;$('add').onclick=()=>contactForm();document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>contactForm(b.dataset.contact))}const SMA_ROLE_KEY='sma_crm_contact_roles_v1';
const SMA_ROLE_DEFAULTS=['Amministrazione','Ufficio tecnico','Responsabile cantiere','Amministratore condominio','Titolare','Direzione','Ufficio acquisti','Responsabile manutenzione','Responsabile sicurezza','Progettista','Geometra','Architetto','Ingegnere','Referente commerciale','Altro'];
function smaRoles(){let custom=[];try{const a=JSON.parse(localStorage.getItem(SMA_ROLE_KEY)||'[]');if(Array.isArray(a))custom=a.filter(x=>typeof x==='string')}catch(e){}return [...new Set([...SMA_ROLE_DEFAULTS,...custom].map(x=>x.trim()).filter(Boolean))]}
function smaRoleSelect(value='',cls='linked-role'){let roles=smaRoles();if(value&&!roles.includes(value))roles.push(value);return `<select class="${cls}" style="flex:2;min-width:140px"><option value="">Seleziona ruolo...</option>${roles.map(r=>`<option value="${esc(r)}" ${r===value?'selected':''}>${esc(r)}</option>`).join('')}</select>`}
function smaAddRole(){let v=prompt('Nome del nuovo ruolo da aggiungere al menu:');if(v===null)return null;v=v.trim().replace(/\s+/g,' ');if(!v)return null;let roles=smaRoles(),existing=roles.find(x=>x.toLowerCase()===v.toLowerCase());if(existing)return existing;let custom=[];try{custom=JSON.parse(localStorage.getItem(SMA_ROLE_KEY)||'[]');if(!Array.isArray(custom))custom=[]}catch(e){}custom.push(v);try{localStorage.setItem(SMA_ROLE_KEY,JSON.stringify(custom))}catch(e){alert('Impossibile salvare il nuovo ruolo.');return null}return v}

function contactForm(contactId){let old=records.find(r=>r.id===contactId&&r.type==='contatti')||{};$('title').textContent=contactId?'Modifica contatto':'Nuovo contatto';$('content').innerHTML=`<div class="panel"><form id="entry">${input('name','Nome e cognome',old.name,true)}${input('phone','Telefono',old.phone,true)}${input('email','Email',old.email,true,'type="email"')}${input('city','Comune',old.city,true)}<div><label for="f_role">Ruolo / Qualifica</label>${smaRoleSelect(old.role||'','contact-main-role').replace('<select ','<select id="f_role" name="role" ')}</div><div class="full"><label>Clienti collegati e ruolo per cliente</label><p class="note">Seleziona un ruolo standard per ogni collegamento. Puoi aggiungerne altri in qualsiasi momento.</p><button class="btn secondary" type="button" id="newRole" style="margin-bottom:10px">+ Aggiungi ruolo al menu</button><div id="clientLinks"></div><button class="btn secondary" type="button" id="addLink">+ Collega cliente</button></div><div class="full line"><button class="btn">Salva contatto</button><button type="button" class="btn secondary" id="cancel">Annulla</button></div></form></div>`;const addLink=(link={})=>{let row=document.createElement('div');row.className='line';row.style.marginBottom='9px';row.innerHTML=`<select class="linked-client" style="flex:2;min-width:160px"><option value="">Seleziona cliente</option>${clients().map(c=>`<option value="${esc(c.id)}" ${link.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${smaRoleSelect(link.role||'')}<button class="btn secondary" type="button">Rimuovi</button>`;row.querySelector('button').onclick=()=>row.remove();$('clientLinks').appendChild(row)};(old.clientLinks||[]).forEach(addLink);$('addLink').onclick=()=>addLink();$('newRole').onclick=()=>{const added=smaAddRole();if(added){const current=document.activeElement;smaRefreshRoleSelects(added,current&&current.matches('select.linked-role,select#f_role')?current:null);}};setupAddressAutocomplete( function setupAddressAutocomplete(){const city=$('f_city');if(!city)return;const list=document.createElement('datalist');list.id='sma-comuni';document.body.appendChild(list);city.setAttribute('list','sma-comuni');let all=[];loadComuni().then(data=>{all=data}).catch(()=>{city.title='Ricerca automatica non disponibile: inserire manualmente'});const fill=()=>{const q=city.value.trim().toLowerCase();list.innerHTML='';if(q.length<2)return;all.filter(c=>c.nome.toLowerCase().startsWith(q)).slice(0,30).forEach(c=>{let o=document.createElement('option');o.value=c.nome;list.appendChild(o)});const c=all.find(c=>c.nome.toLowerCase()===q);if(c){const province=$('f_province'),cap=$('f_cap');if(province)province.value=c.sigla||c.provincia?.sigla||'';if(cap){const caps=Array.isArray(c.cap)?c.cap:[c.cap].filter(Boolean);if(caps.length===1)cap.value=caps[0];else if(caps.length>1){cap.placeholder='CAP da selezionare: '+caps.slice(0,4).join(', ');cap.value=''}}}};city.addEventListener('input',fill);city.addEventListener('change',fill)}
function parseCSV(text){const first=text.split(/\r?\n/)[0]||'';const delim=[';',',','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===delim&&!quoted){row.push(cell);cell=''}else if((ch==='\r'||ch==='\n')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()))rows.push(row);row=[]}else cell+=ch}row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row);return rows}
function loadSheetJS(){if(window.XLSX)return Promise.resolve();return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';script.onload=()=>window.XLSX?resolve():reject(Error('Libreria Excel non disponibile'));script.onerror=()=>reject(Error('Libreria Excel non raggiungibile'));document.head.appendChild(script)})}
function importClients(){ $('title').textContent='Importa clienti';$('subtitle').textContent='Excel / CSV · verifica prima del salvataggio';$('content').innerHTML='<div class="panel"><h2>Importa clienti</h2><p class="note">Seleziona un file CSV, XLSX o XLS. I dati vengono elaborati nel browser.</p><input id="upload" type="file" accept=".csv,.xlsx,.xls"><p id="importMsg" class="note"></p><div id="importWork"></div><button class="btn secondary" id="backImport">← Clienti</button></div>';$('backImport').onclick=()=>show('clienti');$('upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{let matrix;if(/\.csv$/i.test(file.name)){matrix=parseCSV((await file.text()).replace(/^\ufeff/,''))}else{await loadSheetJS();const book=XLSX.read(await file.arrayBuffer(),{type:'array'});matrix=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,raw:false,defval:''})}if(matrix.length<2)throw Error('Nessuna anagrafica trovata');renderImport(matrix)}catch(err){$('importMsg').textContent='Errore: '+err.message}}}
function renderImport(matrix){const headers=matrix[0].map(x=>String(x).trim());const rows=matrix.slice(1).filter(r=>r.some(v=>String(v).trim()));const fields=[['name','Nome / Ragione sociale'],['kind','Tipologia'],['status','Stato commerciale'],['phone','Telefono'],['email','Email'],['street','Indirizzo'],['cap','CAP'],['city','Comune'],['province','Provincia'],['vat','Partita IVA'],['taxCode','Codice fiscale'],['pec','PEC'],['sdi','SDI']];const aliases={name:['nome','ragione sociale','denominazione','cliente'],kind:['tipo','tipologia','categoria'],status:['stato','stato commerciale'],phone:['telefono','cellulare','tel'],email:['email','e-mail','mail'],street:['indirizzo','via','indirizzo completo'],cap:['cap'],city:['comune','citta','città'],province:['provincia','prov'],vat:['partita iva','piva','p.iva'],taxCode:['codice fiscale','cf'],pec:['pec'],sdi:['sdi']};const norm=x=>String(x??'').toLowerCase().trim().replace(/[^a-z0-9àèéìòù]/g,'');$('importWork').innerHTML='<h2>Associa le colonne</h2><div id="mappings" class="filters" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"></div><div class="line"><label>Stato predefinito <select id="defaultStatus"><option value="potenziale">Potenziale</option><option value="acquisito">Acquisito</option></select></label><label>Tipologia predefinita <select id="defaultKind"><option>Azienda</option><option>Privato</option><option>Professionista</option><option>Condominio</option><option>Impresa edile</option></select></label><label>Duplicati <select id="duplicateMode"><option value="skip">Ignora</option><option value="update">Aggiorna</option></select></label></div><button class="btn" id="previewImport">Controlla righe</button><div id="previewResult"></div>';fields.forEach(([key,label])=>{let div=document.createElement('div');div.innerHTML='<label>'+esc(label)+'</label>';let sel=document.createElement('select');sel.dataset.key=key;sel.add(new Option('Non importare',''));headers.forEach((h,i)=>sel.add(new Option(h||'Colonna '+(i+1),String(i))));const i=headers.findIndex(h=>(aliases[key]||[]).some(a=>norm(a)===norm(h)));sel.value=i<0?'':String(i);div.appendChild(sel);$('mappings').appendChild(div)});const make=()=>rows.map((r,i)=>{let obj={};document.querySelectorAll('#mappings select').forEach(sel=>obj[sel.dataset.key]=sel.value===''?'':String(r[Number(sel.value)]??'').trim());obj.kind=['Azienda','Privato','Professionista','Condominio','Impresa edile'].find(t=>norm(t)===norm(obj.kind))||$('defaultKind').value;obj.status=['acquisito','cliente','attivo'].includes(norm(obj.status))?'acquisito':obj.status? 'potenziale':$('defaultStatus').value;obj.errors=['name','phone','email','street','cap','city','province'].filter(k=>!obj[k]);if(obj.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(obj.email))obj.errors.push('email non valida');obj.row=i+2;return obj});const duplicate=(obj)=>clients().find(c=>(obj.vat&&norm(obj.vat)===norm(c.vat))||(obj.taxCode&&norm(obj.taxCode)===norm(c.taxCode))||(norm(obj.name)===norm(c.name)&&norm(obj.street)===norm(c.street)&&norm(obj.city)===norm(c.city)));$('previewImport').onclick=()=>{const data=make();$('previewResult').innerHTML='<h2>Anteprima ('+data.length+' righe)</h2><div style="max-height:360px;overflow:auto"><table><tr><th>Riga</th><th>Cliente</th><th>Comune</th><th>Esito</th></tr>'+data.slice(0,200).map(r=>'<tr><td>'+r.row+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.city)+'</td><td>'+esc(r.errors.length?'Errore: '+r.errors.join(', '):duplicate(r)?'Duplicato':'Valido')+'</td></tr>').join('')+'</table></div><p class="note">Righe con errori escluse; primi 200 risultati mostrati.</p><button class="btn" id="confirmImport">Conferma importazione</button>';$('confirmImport').onclick=()=>{const input=make(),mode=$('duplicateMode').value;let added=0,updated=0,skipped=0,seen=new Set();const original=JSON.stringify(records);for(const r of input){if(r.errors.length){skipped++;continue}const key=norm(r.vat)||norm(r.taxCode)||norm(r.name)+'|'+norm(r.street)+'|'+norm(r.city);if(seen.has(key)){skipped++;continue}seen.add(key);const old=duplicate(r);const obj={...r};delete obj.errors;delete obj.row;if(old){if(mode==='update'){Object.keys(obj).forEach(k=>{if(obj[k])old[k]=obj[k]});updated++}else skipped++}else{records.push({id:id(),type:'clienti',...obj});added++}}try{persist();alert('Importazione completata: '+added+' nuovi, '+updated+' aggiornati, '+skipped+' ignorati.');show('clienti')}catch(e){records=JSON.parse(original);alert('Impossibile salvare: spazio locale insufficiente')}}}}

const COMMERCIAL_KEY='sma_demo_commercial_v13';
let commercial=[];

const euro=v=>new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true}).format(Number(v)||0)+' €';

function clientStats(cid){
  const docs=commercial.filter(d=>d.clientId===cid);
  const offers=docs.filter(d=>d.type==='offerta');
  const orders=offers.filter(d=>d.state==='ordine');
  const open=offers.filter(d=>d.state==='aperta');
  return {offers:offers.length,offerValue:offers.reduce((a,d)=>a+amount(d.value),0),orders:orders.length,orderValue:orders.reduce((a,d)=>a+amount(d.value),0),openValue:open.reduce((a,d)=>a+amount(d.value),0)};
}
function clientTotals(items){return items.reduce((a,c)=>{const s=clientStats(c.id);Object.keys(a).forEach(k=>a[k]+=s[k]);return a},{offers:0,offerValue:0,orders:0,orderValue:0,openValue:0})}

const tableStyle=document.createElement('style');tableStyle.textContent=`table thead th[data-sortable]{cursor:pointer;white-space:nowrap;user-select:none}table thead th[data-sortable]:hover{color:#b20d19}table thead th .sortmark{opacity:.55;font-size:11px;margin-left:5px}tr.table-filters th{padding:5px 6px!important;background:#fafafa}tr.table-filters input{width:100%;min-width:65px;box-sizing:border-box;padding:6px;font-size:11px;border:1px solid #ddd;border-radius:5px}tr.table-filters th:last-child input{min-width:55px}`;document.head.appendChild(tableStyle);
function enhanceTables(){
 document.querySelectorAll('#content table').forEach(table=>{
  if(table.closest('#quotePrintable'))return; // Le tabelle dell'offerta non sono tabelle CRM filtrabili
  if(table.dataset.enhanced==='1')return;
  const head=table.tHead,body=table.tBodies[0];if(!head||!body||!head.rows.length)return;
  const headings=Array.from(head.rows[0].cells);if(headings.length<2)return;
  table.dataset.enhanced='1';let sortIndex=-1,sortDir=1;
  const filterRow=document.createElement('tr');filterRow.className='table-filters';
  headings.forEach((th,i)=>{
   th.dataset.sortable='1';const mark=document.createElement('span');mark.className='sortmark';mark.textContent='↕';th.appendChild(mark);
   const cell=document.createElement('th'),field=document.createElement('input');field.type='search';field.placeholder='Filtra';field.setAttribute('aria-label','Filtra '+th.textContent.replace('↕','').trim());cell.appendChild(field);filterRow.appendChild(cell);
   field.addEventListener('input',apply);
   th.addEventListener('click',()=>{sortDir=sortIndex===i?-sortDir:1;sortIndex=i;headings.forEach(h=>h.querySelector('.sortmark').textContent='↕');mark.textContent=sortDir===1?'↑':'↓';apply()});
  });head.appendChild(filterRow);
  function normalize(v){let t=v.trim().replace(/\s/g,'');if(/^[€+-]?[\d.,]+%?$/.test(t)){t=t.replace('€','').replace('%','');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');const n=Number(t);if(Number.isFinite(n))return n}return v.toLocaleLowerCase('it-IT')}
  function apply(){const queries=Array.from(filterRow.querySelectorAll('input')).map(x=>x.value.toLocaleLowerCase('it-IT').trim());const rows=Array.from(body.rows);rows.forEach(r=>{r.hidden=queries.some((q,i)=>q&&!String(r.cells[i]?.innerText||r.cells[i]?.textContent||'').toLocaleLowerCase('it-IT').includes(q))});if(sortIndex>=0){rows.sort((a,b)=>{const x=normalize(a.cells[sortIndex]?.textContent||''),y=normalize(b.cells[sortIndex]?.textContent||'');return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'it',{numeric:true}))*sortDir}).forEach(r=>body.appendChild(r))}}
 });
}

.qpaper{--offer-title:18px;--offer-body:12px;--offer-description:12px;font-size:var(--offer-body)!important;line-height:1.48}
.qp-heading,.qp-rip .qp-heading,.qp-mod .qp-heading{background:#20252e!important;color:#fff!important;border:0!important;border-radius:9px!important;padding:16px 19px!important;margin:17px 0!important}

.qp-customer{display:block!important;line-height:1.35!important;margin:10px 0!important}.qp-customer>div{margin:1px 0!important}.qp-customer strong{display:block;font-size:calc(var(--offer-body) * 1.08)}

.qp-items .qimg{float:none!important;margin:0!important;max-width:100%;width:95px;height:auto;object-fit:contain}
.qp-image-disclaimer{font-size:calc(var(--offer-body) * .83);color:#69717a;font-style:italic;margin:7px 0 10px}

function fuCompose(t){const q=t.q,c=clients().find(x=>x.id===q.draft.clientId)||{},which=t.rule.relative==='expiry'?'expiry':t.rule.name.toLowerCase().includes('riscontro')?'feedback':'receipt';const replace=s=>String(s||'').replace(/\{numero\}/g,q.number).replace(/\{oggetto\}/g,q.draft.subject||'').replace(/\{scadenza\}/g,fuISO(t.expiry));page='followup';nav();$('title').textContent='Prepara follow-up';$('subtitle').textContent=q.number;$('content').innerHTML=`<div class="actions"><button class="btn secondary" id="fuCancel">← Torna alle attività</button></div><div class="panel"><h2>${esc(t.rule.name)} · ${esc(q.number)}</h2><p class="note">Gmail verrà aperto con oggetto e corpo precompilati. <strong>Non è un invio automatico e non contiene il PDF in allegato.</strong> Verifica destinatario, contenuto e allegati prima di inviare.</p><div><label>Destinatario</label><input id="fuTo" type="email" value="${esc(c.email||'')}"></div><div><label>Oggetto</label><input id="fuSubject" value="${esc('SMA Ascensori | Riscontro offerta '+q.number)}"></div><div><label>Messaggio</label><textarea id="fuBody" rows="12">${esc(replace(fuSettings.templates[which]))}</textarea></div><div class="actions"><button class="btn" id="fuOpenGmail">Apri bozza in Gmail</button><button class="btn secondary" id="fuCopy">Copia testo</button></div></div>`;$('fuCancel').onclick=fuPage;$('fuCopy').onclick=()=>{navigator.clipboard?.writeText($('fuBody').value).then(()=>alert('Testo copiato')).catch(()=>alert('Copia non disponibile'))};$('fuOpenGmail').onclick=()=>{const to=$('fuTo').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to))return alert('Inserisci una email valida');const url='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(to)+'&su='+encodeURIComponent($('fuSubject').value)+'&body='+encodeURIComponent($('fuBody').value);window.open(url,'_blank','noopener,noreferrer');};}

function man35Q(n,c){return c.quantity[n>=10?4:n>=6?3:n>=4?2:n>=2?1:0]||0}
function man35CalcPlant(p,customer,years,count,c){const type=p.type||'Ascensore',special=['Servoscala','Scala o tappeto mobile'].includes(type);let v=man35Num(c.base[type]);if(!special){if(p.brandType==='Altre marche')v+=man35Num(c.brandOther);if(type==='Ascensore'&&p.drive==='Oleodinamico')v+=man35Num(c.hydraulic);if(['Piattaforma','Montacarichi merci','Montauto'].includes(type)&&p.drive==='Elettrico')v-=man35Num(c.hydraulic);v+=Math.max(0,man35Num(p.stops)-2)*man35Num(c.stopExtra);const kg=man35Num(p.capacity);v+=man35Num(c.capacity[kg<=630?0:kg<=1000?1:kg<=2000?2:3]);}v=Math.max(0,v)*(1+man35Num(c.client[customer])/100);const sq=man35Q(count,c),sd=man35Num(c.duration[Math.max(0,Math.min(4,years-1))]);return c.plans.map((percent,idx)=>{const maintenance=Math.ceil(v*(1+man35Num(percent)/100)*(1-sq/100)*(1-sd/100));let extra=0,once=0;for(const e of c.extras){const status=e.availability[idx]||'unavailable';if(status==='extra'&&(p.extras||[]).includes(e.id)&&(!e.smaOnly||p.brandType==='SMA')){extra+=man35Num(e.monthly);once+=man35Num(e.once)}}return {maintenance,extra,once,total:maintenance+extra};});}

function man35Settings(){page='impostazioni';nav();$('title').textContent='Impostazioni · Listino MAN';$('subtitle').textContent='Valori base, maggiorazioni, sconti e servizi extra';const c=man35Config;const field=(key,label,value)=>`<div><label>${label}</label><input type="number" step="any" data-m35setting="${key}" value="${esc(value)}"></div>`;$('content').innerHTML=`<div class="actions"><button class="btn secondary" id="m35settingsBack">← Offerte MAN</button><button class="btn" id="m35settingsSave">Salva listino</button><button class="btn secondary" id="m35extraAdd">+ Nuovo servizio extra</button></div><div class="panel"><h2>Prezzi base Essenziale (€ / mese)</h2><div class="qgrid">${man35Types.map(k=>field('base.'+k,k,c.base[k])).join('')}</div><p class="note">Base condominio, marca SMA, 2 fermate, fino a 630 kg. Ascensore elettrico; piattaforma, montacarichi e montauto oleodinamici. Per servoscala e scale/tappeti mobili non si applicano maggiorazioni tecniche.</p></div><div class="panel"><h2>Correttivi tecnici (€ / mese)</h2><div class="qgrid">${field('brandOther','Altre marche (valore negativo)',c.brandOther)}${field('hydraulic','Oleodinamico rispetto a elettrico (solo ascensori)',c.hydraulic)}${field('stopExtra','Ogni fermata oltre la seconda',c.stopExtra)}${['Fino a 630 kg','631–1.000 kg','1.001–2.000 kg','Oltre 2.000 kg'].map((l,i)=>field('capacity.'+i,l,c.capacity[i])).join('')}</div></div><div class="panel"><h2>Correttivi cliente (%)</h2><div class="qgrid">${man35Clients.map(k=>field('client.'+k,k,c.client[k])).join('')}</div></div><div class="panel"><h2>Maggiorazioni delle formule (%)</h2><div class="qgrid">${MAN_PLANS.map((k,i)=>field('plans.'+i,k,c.plans[i])).join('')}</div></div><div class="panel"><h2>Sconti quantità (%)</h2><div class="qgrid">${['1 impianto','2–3 impianti','4–5 impianti','6–9 impianti','10 o più impianti'].map((k,i)=>field('quantity.'+i,k,c.quantity[i])).join('')}</div></div><div class="panel"><h2>Sconti durata (%)</h2><div class="qg function man35Edit(mid){const old=manOffers.find(x=>x.id===mid)||{};const c=old.configSnapshot||man35Config;let plants=old.plants?.map(x=>({...x,extras:[...(x.extras||[])]}))||[];if(!plants.length)plants=[{type:'Ascensore',brandType:'SMA',brand:'SMA',drive:'Elettrico',capacity:630,stops:2,extras:[]}];let mode=old.mode||'standard';page='preventivi';nav();$('title').textContent=mid?'Modifica offerta MAN':'Nuova offerta MAN';$('subtitle').textContent='Prezzo per impianto · quattro formule · servizi extra';$('content').innerHTML=`<div class="actions"><button class="btn secondary" id="m35cancel">← Offerte MAN</button><button class="btn" id="m35save">Salva offerta</button>${mid?'<button class="btn secondary" id="m35pdf">Anteprima / PDF</button>':''}</div><div class="panel"><h2>Dati contratto</h2><div class="qgrid"><div><label>Cliente *</label><select id="m35client"><option value="">Seleziona cliente</option>${clients().map(x=>`<option value="${esc(x.id)}" ${old.clientId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>Tipo cliente</label><select id="m35customer">${man35Select(man35Clients,old.customerType||'Condominio')}</select></div><div><label>Durata contratto</label><select id="m35years">${[1,2,3,4,5].map(x=>`<option value="${x}" ${Number(old.years||1)===x?'selected':''}>${x} ${x===1?'anno':'anni'}</option>`).join('')}</select></div><div><label>Gestione formule</label><select id="m35mode"><option value="standard" ${mode==='standard'?'selected':''}>Standard: una formula per tutti</option><option value="mixed" ${mode==='mixed'?'selected':''}>Mista: formula per singolo impianto</option></select></div></div><p class="note">Le quattro proposte rimangono sempre visibili. La formula mista è facoltativa.</p></div><div class="panel"><div class="actions"><h2>Impianti del contratto</h2><button class="btn secondary" id="m35add">+ Aggiungi impianto</button></div><div id="m35plants"></div></div><div class="panel"><h2>Riepilogo canoni</h2><div id=" );plants.splice(Number(el.dataset.m35removeplant),1);render()})};$('m35customer').onchange=render;$('m35years').onchange=render;$('m35mode').onchange=render;$('m35add').onclick=()=>{plants.push({type:'Ascensore',brandType:'SMA',brand:'SMA',drive:'Elettrico',capacity:630,stops:2,extras:[]});render()};$('m35cancel').onclick=man35List;if(mid)$('m35pdf').onclick=()=>man35Preview(mid);$('m35save').onclick=()=>{if(!$('m35client').value)return alert('Seleziona un cliente');const customerType=$('m35customer').value,years=Number($('m35years').value);const next={...old,id:old.id||id(),engine:'35',clientId:$('m35client').value,customerType,years,mode,plants:structuredClone(plants),notes:$('m35notes').value,configSnapshot:structuredClone(c),updated:new Date().toISOString()};if(!old.id){const yy=String(new Date().getFullYear()).slice(-2);let i=1;while(manOffers.some(o=>String(o.number||'').startsWith('MAN'+String(i).padStart(4,'0')+yy)))i++;const cname=clientName(next.clientId).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').slice(0,40);next.number=smaCompleteNumber(smaNextNumber('MAN'),clientName(next.clientId));next.revisions=[]}else{const changed=JSON.stringify({plants:old.plants,years:old.years,customerType:old.customerType,mode:old.mode,notes:old.notes})!==JSON.stringify({plants:next.plants,years:next.years,customerType:next.customerType,mode:next.mode,notes:next.notes});if(changed){next.revisions=[...(old.revisions||[]),{date:new Date().toISOString(),snapshot:structuredClone({...old,revisions:[]})}];next.number=old.number.replace(/R\d{2}(?=_)/,'R'+String(next.revisions.length).padStart(2,'0'))}}const idx=manOffers.findIndex(x=>x.id===next.id);if(idx<0)manOffers.push(next);else manOffers[idx]=next;try{manSave();man35List()}catch(e){alert('Salvataggio non riuscito: '+e.message)}};render()}
function man35Preview(mid){const o=manOffers.find(x=>x.id===mid);if(!o)return;const c=o.configSnapshot||man35Config,customer=clients().find(x=>x.id===o.clientId)||{},rows=o.plants.map(p=>man35CalcPlant(p,o.customerType,o.years,o.plants.length,c)),totals=man35Totals(o);const tr=o.plants.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.type)}</td><td>${esc(p.brand||p.brandType)}</td><td>${esc(p.factory||'')}</td><td>${esc(p.serial||'')}</td><td>${esc(p.location||'')}</td></tr>`).join('');const prices=o.plants.map((p,i)=>`<tr><td>${i+1}. ${esc(p.type)} · ${esc(p.brand||p.brandType)}</td>${rows[i].map(x=>`<td>${man35Money(x.total)}</td>`).join('')}</tr>`).join('');const extras=o.plants.map((p,i)=>`<tr><td>${i+1}. ${esc(p.type)}</td><td>${c.extras.filter(e=>(p.extras||[]).includes(e.id)).map(e=>esc(e.name)).join(', ')||'Nessuno'}</td></tr>`).join('');const html=`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>${esc(o.number)}</title><style>@page{size:A4;margin:35mm 15mm 25mm 25mm}body{font:10pt Arial;color:#222}header{display:flex;justify-content:space-between;align-items:start;margin-bottom:25mm}header img{width:55mm;max-height:24mm;object-fit:contain}header aside{text-align:right;font-size:9pt;line-height:1.5}h1{font-size:19pt}h2{margin-top:12mm}table{border-collapse:collapse;width:100%;font-size:9pt}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{background:#eee}.hero{background:#222;color:white;padding:20px;border-radius:7px;margin:15mm 0}.break{break-before:page}.muted{color:#666;font-size:9pt}tr{break-inside:avoid}@media screen{body{max-width:210mm;margin:20px auto;padding:20px;box-shadow:0 0 0 1px #ccc}}</style></head><body><header><img src="LOGO_SMA_light.png"><aside><b>SMA ASCENSORI SRL</b><br>Via Ugo Zannoni 8<br>37136 VERONA<br>P. IVA e C.F. 04185670231<br>www.smaascensori.it<br>info@smaascensori.it</aside></header><p>Spett.le <b>${esc(customer.name||'Cliente')}</b><br>${esc(customer.street||'')} ${esc(customer.city||'')}</p><div class="
